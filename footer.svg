<svg width="880" height="240" viewBox="0 0 880 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400;500&amp;family=JetBrains+Mono:wght@400&amp;display=swap');

      * { font-family: 'Inter', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }

      @keyframes draw-line {
        0% { stroke-dashoffset: 400; opacity: 0; }
        20% { opacity: 0.1; }
        80% { opacity: 0.1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .footer-line {
        stroke-dasharray: 400;
        animation: draw-line 8s ease-in-out infinite;
      }
    </style>

    <radialGradient id="footer-glow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#141419" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0A0A0C" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect width="880" height="240" fill="url(#footer-glow)"/>

  <!-- Subtle animated top divider line -->
  <line x1="240" y1="40" x2="640" y2="40" stroke="#FFFFFF" stroke-width="1" class="footer-line"/>

  <!-- Contact Information -->
  <g transform="translate(440, 100)" text-anchor="middle">
    <!-- Links -->
    <g class="mono" font-size="12" fill="#A1A1AA">
      <text x="-140" y="0">khanfaizmumbai@gmail.com</text>
      <text x="50" y="0">linkedin</text>
      <text x="140" y="0">github</text>
    </g>

    <!-- Small decorative dot separators -->
    <circle cx="-16" cy="-4" r="1.5" fill="#3F3F46"/>
    <circle cx="94" cy="-4" r="1.5" fill="#3F3F46"/>

    <!-- Sign off -->
    <text x="0" y="70" class="mono" font-size="10" fill="#52525B" letter-spacing="0.1em">FK © 2026</text>
  </g>

</svg>
