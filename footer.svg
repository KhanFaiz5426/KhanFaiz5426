<svg width="1000" height="140" viewBox="0 0 1000 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&amp;display=swap');
      
      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .bg { fill: #070908; }
      
      .final-text {
        font-weight: 300; 
        font-size: 18px; 
        fill: #FFFFFF; 
        letter-spacing: 0.3em; 
      }
      
      /* Links pushed further into the background visually */
      .link-text {
        font-weight: 500; 
        font-size: 8px; 
        fill: #3F4946; 
        letter-spacing: 0.25em; 
        transition: fill 0.2s ease;
      }

      a { cursor: pointer; }
      a:hover .link-text { fill: #6B7974; }

      @keyframes dot1 {
        0% { opacity: 0; }
        10% { opacity: 1; }
        75% { opacity: 1; }
        85% { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes dot2 {
        0% { opacity: 0; }
        25% { opacity: 0; }
        35% { opacity: 1; }
        75% { opacity: 1; }
        85% { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes dot3 {
        0% { opacity: 0; }
        50% { opacity: 0; }
        60% { opacity: 1; }
        75% { opacity: 1; }
        85% { opacity: 0; }
        100% { opacity: 0; }
      }

      .dot1 { animation: dot1 3s infinite; }
      .dot2 { animation: dot2 3s infinite; }
      .dot3 { animation: dot3 3s infinite; }

      @keyframes sweep {
        0% { transform: translateX(0px); }
        100% { transform: translateX(900px); }
      }
      .divider-scan {
        animation: sweep 12s cubic-bezier(0.2, 0, 0.2, 1) infinite;
      }
    </style>
    
    <linearGradient id="flare-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <clipPath id="divider-clip">
      <rect x="120" y="30" width="760" height="20" />
    </clipPath>
  </defs>

  <rect width="1000" height="140" class="bg" />

  <!-- Final Architectural Boundary -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="120" y1="40" x2="880" y2="40" />
  </g>

  <!-- Precision Crosshairs -->
  <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="1">
    <path d="M 117 40 L 123 40 M 120 37 L 120 43" />
    <path d="M 877 40 L 883 40 M 880 37 L 880 43" />
  </g>

  <!-- Motion Identity Sweep -->
  <g clip-path="url(#divider-clip)">
    <rect x="0" y="40" width="350" height="1" fill="url(#flare-gradient)" class="divider-scan" />
  </g>

  <!-- The Narrative Sign-Off -->
  <g transform="translate(120, 85)">
    <text x="0" y="0" class="final-text">MONITORING CONTINUES<tspan fill="#00FF9D" class="dot1">.</tspan><tspan fill="#00FF9D" class="dot2">.</tspan><tspan fill="#00FF9D" class="dot3">.</tspan></text>
  </g>

  <!-- Extremely Understated Links -->
  <!-- Dropped below the narrative baseline so they read as quiet metadata -->
  <g transform="translate(880, 115)" text-anchor="end">
    <a href="https://linkedin.com" target="_blank">
      <text x="-160" y="0" class="link-text">LINKEDIN</text>
    </a>
    <a href="mailto:email@example.com">
      <text x="-80" y="0" class="link-text">EMAIL</text>
    </a>
    <a href="#" target="_blank">
      <text x="0" y="0" class="link-text">RESUME</text>
    </a>
  </g>

</svg>
