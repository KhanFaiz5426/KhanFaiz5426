<svg width="1000" height="180" viewBox="0 0 1000 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap');
      
      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      
      .bg { fill: #0A0A0A; }
      
      .closing-text {
        font-weight: 300;
        font-size: 20px;
        fill: #FFFFFF;
        letter-spacing: 0.15em;
      }

      .closing-accent {
        fill: #10B981;
      }

      .social-label {
        font-weight: 500;
        font-size: 9px;
        fill: #52525B;
        letter-spacing: 0.25em;
        text-transform: uppercase;
      }

      .social-link {
        font-weight: 400;
        font-size: 11px;
        fill: #3F3F46;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .social-link:hover {
        fill: #71717A;
      }

      .footer-brand {
        font-weight: 500;
        font-size: 8px;
        fill: #27272A;
        letter-spacing: 0.3em;
      }

      .divider-line {
        stroke: #FFFFFF;
        stroke-opacity: 0.04;
        stroke-width: 1;
      }

      /* Typing dots animation */
      @keyframes dot1 {
        0%, 10% { opacity: 0; }
        15%, 75% { opacity: 1; }
        85%, 100% { opacity: 0; }
      }
      @keyframes dot2 {
        0%, 30% { opacity: 0; }
        35%, 75% { opacity: 1; }
        85%, 100% { opacity: 0; }
      }
      @keyframes dot3 {
        0%, 50% { opacity: 0; }
        55%, 75% { opacity: 1; }
        85%, 100% { opacity: 0; }
      }

      .dot-1 { animation: dot1 3s infinite; }
      .dot-2 { animation: dot2 3s infinite; }
      .dot-3 { animation: dot3 3s infinite; }
    </style>
  </defs>

  <rect width="1000" height="180" class="bg" />

  <!-- Top divider -->
  <line x1="120" y1="14" x2="880" y2="14" class="divider-line" />

  <!-- Closing statement -->
  <g transform="translate(120, 70)">
    <text x="0" y="0" class="closing-text">
      BUILDING DEFENSE<tspan class="closing-accent">.</tspan><tspan class="closing-accent dot-1">.</tspan><tspan class="closing-accent dot-2">.</tspan><tspan class="closing-accent dot-3">.</tspan>
    </text>
  </g>

  <!-- Social links -->
  <g transform="translate(120, 120)">
    <text x="0" y="0" class="social-label">CONNECT</text>
    
    <g transform="translate(0, 25)">
      <text x="0" y="0" class="social-link">GitHub</text>
      <text x="60" y="0" fill="#27272A">·</text>
      <text x="75" y="0" class="social-link">LinkedIn</text>
      <text x="140" y="0" fill="#27272A">·</text>
      <text x="155" y="0" class="social-link">Email</text>
      <text x="205" y="0" fill="#27272A">·</text>
      <text x="220" y="0" class="social-link">Resume</text>
    </g>
  </g>

  <!-- Bottom brand -->
  <g transform="translate(880, 155)" text-anchor="end">
    <text x="0" y="0" class="footer-brand">FK · 2024</text>
  </g>
</svg>
