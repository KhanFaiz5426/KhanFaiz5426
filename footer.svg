<svg width="1000" height="160" viewBox="0 0 1000 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap');
      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .closing { font-weight: 300; font-size: 22px; fill: #FAFAFA; letter-spacing: 0.12em; }
      .accent { fill: #10B981; }
      .link { font-weight: 500; font-size: 10px; fill: #52525B; letter-spacing: 0.12em; text-transform: uppercase; }
      .brand { font-weight: 500; font-size: 8px; fill: #27272A; letter-spacing: 0.3em; }
      .line { stroke: #FFFFFF; stroke-opacity: 0.05; stroke-width: 1; }
      a { cursor: pointer; }

      @keyframes blink1 { 0%,10%{opacity:0} 15%,75%{opacity:1} 85%,100%{opacity:0} }
      @keyframes blink2 { 0%,30%{opacity:0} 35%,75%{opacity:1} 85%,100%{opacity:0} }
      @keyframes blink3 { 0%,50%{opacity:0} 55%,75%{opacity:1} 85%,100%{opacity:0} }
      .d1 { animation: blink1 3s infinite; }
      .d2 { animation: blink2 3s infinite; }
      .d3 { animation: blink3 3s infinite; }
    </style>
  </defs>

  <rect width="1000" height="160" fill="#09090B"/>

  <!-- Divider -->
  <line x1="120" y1="15" x2="880" y2="15" class="line"/>

  <!-- Closing -->
  <text x="120" y="65" class="closing">
    BUILDING DEFENSE<tspan class="accent">.</tspan><tspan class="accent d1">.</tspan><tspan class="accent d2">.</tspan><tspan class="accent d3">.</tspan>
  </text>

  <!-- Links -->
  <g transform="translate(120, 110)">
    <a href="https://github.com/KhanFaiz5426" target="_blank">
      <text x="0" y="0" class="link">GitHub</text>
    </a>
    <text x="62" y="0" fill="#27272A">·</text>
    <a href="https://www.linkedin.com/in/faiz-khan-b03a2a3a7" target="_blank">
      <text x="78" y="0" class="link">LinkedIn</text>
    </a>
    <text x="148" y="0" fill="#27272A">·</text>
    <a href="mailto:khanfaizmumbai@gmail.com">
      <text x="164" y="0" class="link">Email</text>
    </a>
    <text x="210" y="0" fill="#27272A">·</text>
    <a href="#" target="_blank">
      <text x="226" y="0" class="link">Resume</text>
    </a>
  </g>

  <!-- Brand -->
  <text x="880" y="145" text-anchor="end" class="brand">FK · 2024</text>
</svg>
