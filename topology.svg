<svg width="880" height="540" viewBox="0 0 880 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');

      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace; }

      @keyframes hub-breathe {
        0%, 100% { stroke-opacity: 0.12; }
        50% { stroke-opacity: 0.35; }
      }
      .hub-ring { animation: hub-breathe 5s ease-in-out infinite; }

      @keyframes node-idle {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .status-pulse { animation: node-idle 3s ease-in-out infinite; }
    </style>

    <linearGradient id="t-top-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8A84C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E8A84C" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#E8A84C" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="t-path-active" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8A84C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E8A84C" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="880" height="540" fill="#08080A"/>
  <rect width="880" height="1" fill="url(#t-top-edge)"/>

  <!-- Blueprint grid (very subtle) -->
  <g stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1">
    <line x1="0" y1="135" x2="880" y2="135"/>
    <line x1="0" y1="270" x2="880" y2="270"/>
    <line x1="0" y1="405" x2="880" y2="405"/>
    <line x1="220" y1="0" x2="220" y2="540"/>
    <line x1="440" y1="0" x2="440" y2="540"/>
    <line x1="660" y1="0" x2="660" y2="540"/>
  </g>

  <!-- Grid intersection marks -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <line x1="437" y1="270" x2="443" y2="270"/><line x1="440" y1="267" x2="440" y2="273"/>
    <line x1="217" y1="135" x2="223" y2="135"/><line x1="220" y1="132" x2="220" y2="138"/>
    <line x1="657" y1="135" x2="663" y2="135"/><line x1="660" y1="132" x2="660" y2="138"/>
    <line x1="217" y1="405" x2="223" y2="405"/><line x1="220" y1="402" x2="220" y2="408"/>
    <line x1="657" y1="405" x2="663" y2="405"/><line x1="660" y1="402" x2="660" y2="408"/>
  </g>

  <!-- Corner marks -->
  <g stroke="#1C1C22" stroke-width="1" opacity="0.6">
    <line x1="56" y1="24" x2="64" y2="24"/><line x1="60" y1="20" x2="60" y2="28"/>
    <line x1="816" y1="24" x2="824" y2="24"/><line x1="820" y1="20" x2="820" y2="28"/>
    <line x1="56" y1="518" x2="64" y2="518"/><line x1="60" y1="514" x2="60" y2="522"/>
    <line x1="816" y1="518" x2="824" y2="518"/><line x1="820" y1="514" x2="820" y2="522"/>
  </g>

  <!-- Module ID -->
  <text x="820" y="52" text-anchor="end" class="mono" font-size="9" fill="#2A2A32" letter-spacing="0.12em">SYS—02</text>

  <!-- Section label -->
  <text x="60" y="52" class="mono" font-size="9" font-weight="500" fill="#3A3A44" letter-spacing="0.25em">DETECTION COVERAGE MAP</text>

  <!-- Subtitle -->
  <text x="60" y="74" font-size="12" font-weight="300" fill="#44444D">How these systems connect to form a unified detection architecture.</text>

  <!-- ═══════════════════════════════════════════════════════════
       CONNECTION PATHS (drawn first, behind nodes)
       ═══════════════════════════════════════════════════════════ -->

  <!-- Path 1: Linux Auth → Center Hub -->
  <path id="path-la" d="M 255,165 C 320,165 350,220 380,268" fill="none" stroke="#E8A84C" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Path 2: Windows Event → Center Hub -->
  <path id="path-we" d="M 595,148 C 545,148 520,210 500,262" fill="none" stroke="#E8A84C" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Path 3: Mini NIDR → Center Hub -->
  <path id="path-mn" d="M 245,415 C 320,415 370,350 400,302" fill="none" stroke="#E8A84C" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Path 4: Rubber Ducky → Center Hub -->
  <path id="path-rd" d="M 610,420 C 550,420 510,350 480,302" fill="none" stroke="#E8A84C" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Path annotations (what flows through each connection) -->
  <text x="298" y="198" class="mono" font-size="7" fill="#2A2A32" letter-spacing="0.05em" transform="rotate(-22, 298, 198)">auth.log events</text>
  <text x="552" y="192" class="mono" font-size="7" fill="#2A2A32" letter-spacing="0.05em" transform="rotate(20, 552, 192)">evtx telemetry</text>
  <text x="300" y="378" class="mono" font-size="7" fill="#2A2A32" letter-spacing="0.05em" transform="rotate(22, 300, 378)">network packets</text>
  <text x="556" y="382" class="mono" font-size="7" fill="#2A2A32" letter-spacing="0.05em" transform="rotate(-20, 556, 382)">usb hid events</text>

  <!-- ═══════════════════════════════════════════════════════════
       ANIMATED DATA PULSES (flowing toward center)
       ═══════════════════════════════════════════════════════════ -->

  <!-- Pulse 1: from Linux Auth (stagger: 0s) -->
  <circle r="3" fill="#E8A84C" opacity="0">
    <animateMotion dur="10s" begin="0s" repeatCount="indefinite"
      keyPoints="0;0;1;1" keyTimes="0;0.01;0.24;1" calcMode="spline" keySplines="0 0.4 0.6 1;0 0 1 1;0 0 1 1"
      path="M 255,165 C 320,165 350,220 380,268"/>
    <animate attributeName="opacity" values="0;0.85;0.85;0;0" keyTimes="0;0.03;0.20;0.25;1" dur="10s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="7" fill="#E8A84C" opacity="0">
    <animateMotion dur="10s" begin="0s" repeatCount="indefinite"
      keyPoints="0;0;1;1" keyTimes="0;0.01;0.24;1" calcMode="spline" keySplines="0 0.4 0.6 1;0 0 1 1;0 0 1 1"
      path="M 255,165 C 320,165 350,220 380,268"/>
    <animate attributeName="opacity" values="0;0.1;0.1;0;0" keyTimes="0;0.03;0.20;0.25;1" dur="10s" begin="0s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulse 2: from Windows Event (stagger: 2.5s) -->
  <circle r="3" fill="#E8A84C" opacity="0">
    <animateMotion dur="10s" begin="2.5s" repeatCount="indefinite"
      keyPoints="0;0;1;1" keyTimes="0;0.01;0.24;1" calcMode="spline" keySplines="0 0.4 0.6 1;0 0 1 1;0 0 1 1"
      path="M 595,148 C 545,148 520,210 500,262"/>
    <animate attributeName="opacity" values="0;0.85;0.85;0;0" keyTimes="0;0.03;0.20;0.25;1" dur="10s" begin="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="7" fill="#E8A84C" opacity="0">
    <animateMotion dur="10s" begin="2.5s" repeatCount="indefinite"
      keyPoints="0;0;1;1" keyTimes="0;0.01;0.24;1" calcMode="spline" keySplines="0 0.4 0.6 1;0 0 1 1;0 0 1 1"
      path="M 595,148 C 545,148 520,210 500,262"/>
    <animate attributeName="opacity" values="0;0.1;0.1;0;0" keyTimes="0;0.03;0.20;0.25;1" dur="10s" begin="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulse 3: from Mini NIDR (stagger: 5s) -->
  <circle r="3" fill="#E8A84C" opacity="0">
    <animateMotion dur="10s" begin="5s" repeatCount="indefinite"
      keyPoints="0;0;1;1" keyTimes="0;0.01;0.24;1" calcMode="spline" keySplines="0 0.4 0.6 1;0 0 1 1;0 0 1 1"
      path="M 245,415 C 320,415 370,350 400,302"/>
    <animate attributeName="opacity" values="0;0.85;0.85;0;0" keyTimes="0;0.03;0.20;0.25;1" dur="10s" begin="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="7" fill="#E8A84C" opacity="0">
    <animateMotion dur="10s" begin="5s" repeatCount="indefinite"
      keyPoints="0;0;1;1" keyTimes="0;0.01;0.24;1" calcMode="spline" keySplines="0 0.4 0.6 1;0 0 1 1;0 0 1 1"
      path="M 245,415 C 320,415 370,350 400,302"/>
    <animate attributeName="opacity" values="0;0.1;0.1;0;0" keyTimes="0;0.03;0.20;0.25;1" dur="10s" begin="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulse 4: from Rubber Ducky (stagger: 7.5s) -->
  <circle r="3" fill="#E8A84C" opacity="0">
    <animateMotion dur="10s" begin="7.5s" repeatCount="indefinite"
      keyPoints="0;0;1;1" keyTimes="0;0.01;0.24;1" calcMode="spline" keySplines="0 0.4 0.6 1;0 0 1 1;0 0 1 1"
      path="M 610,420 C 550,420 510,350 480,302"/>
    <animate attributeName="opacity" values="0;0.85;0.85;0;0" keyTimes="0;0.03;0.20;0.25;1" dur="10s" begin="7.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="7" fill="#E8A84C" opacity="0">
    <animateMotion dur="10s" begin="7.5s" repeatCount="indefinite"
      keyPoints="0;0;1;1" keyTimes="0;0.01;0.24;1" calcMode="spline" keySplines="0 0.4 0.6 1;0 0 1 1;0 0 1 1"
      path="M 610,420 C 550,420 510,350 480,302"/>
    <animate attributeName="opacity" values="0;0.1;0.1;0;0" keyTimes="0;0.03;0.20;0.25;1" dur="10s" begin="7.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══════════════════════════════════════════════════════════
       CENTER HUB: DETECTION ENGINE
       ═══════════════════════════════════════════════════════════ -->
  <g transform="translate(440, 282)">
    <!-- Breathing ring -->
    <rect x="-96" y="-38" width="192" height="76" rx="6" fill="none" stroke="#E8A84C" stroke-width="1" class="hub-ring"/>
    <!-- Background -->
    <rect x="-94" y="-36" width="188" height="72" rx="5" fill="#0C0C0F" stroke="#1C1C22"/>
    <!-- Amber top accent -->
    <rect x="-94" y="-36" width="188" height="72" rx="5" fill="#E8A84C" opacity="0.03"/>
    <!-- Label -->
    <text x="0" y="-8" text-anchor="middle" class="mono" font-size="10" font-weight="500" fill="#E8A84C" letter-spacing="0.15em">DETECTION ENGINE</text>
    <!-- Sub -->
    <text x="0" y="10" text-anchor="middle" class="mono" font-size="8" fill="#44444D">sigma · correlation · stateful</text>
    <!-- Tiny coordinate -->
    <text x="0" y="26" text-anchor="middle" class="mono" font-size="7" fill="#1C1C22">n:440 e:282</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       PROJECT NODES
       ═══════════════════════════════════════════════════════════ -->

  <!-- Node 1: Linux Auth Analyzer (top-left) -->
  <g transform="translate(165, 152)">
    <rect x="-95" y="-42" width="190" height="84" rx="5" fill="#0C0C0F" stroke="#1C1C22"/>
    <!-- Status dot -->
    <circle cx="-75" cy="-20" r="3" fill="#5BE88A" opacity="0.8"/>
    <text x="-66" y="-17" class="mono" font-size="7" fill="#5BE88A" opacity="0.7">shipped</text>
    <!-- Title -->
    <text x="-75" y="2" font-size="12" font-weight="500" fill="#E4E4E7" letter-spacing="-0.01em">Linux Auth Analyzer</text>
    <!-- Stack -->
    <text x="-75" y="18" class="mono" font-size="8" fill="#44444D">Python · Regex · Syslog</text>
    <!-- Detail -->
    <text x="-75" y="32" class="mono" font-size="7" fill="#2A2A32">28 detection rules · evidence chains</text>
  </g>

  <!-- Node 2: Windows Event Analyzer (top-right) -->
  <g transform="translate(695, 136)">
    <rect x="-95" y="-42" width="190" height="84" rx="5" fill="#0C0C0F" stroke="#1C1C22"/>
    <!-- Status dot (amber, pulsing) -->
    <circle cx="-75" cy="-20" r="3" fill="#E8A84C" class="status-pulse"/>
    <text x="-66" y="-17" class="mono" font-size="7" fill="#E8A84C" opacity="0.6">in development</text>
    <!-- Title -->
    <text x="-75" y="2" font-size="12" font-weight="500" fill="#E4E4E7" letter-spacing="-0.01em">Windows Event Analyzer</text>
    <!-- Stack -->
    <text x="-75" y="18" class="mono" font-size="8" fill="#44444D">Python · EVTX · Sigma</text>
    <!-- Detail -->
    <text x="-75" y="32" class="mono" font-size="7" fill="#2A2A32">binary XML parsing · KQL</text>
  </g>

  <!-- Node 3: Mini NIDR (bottom-left) -->
  <g transform="translate(150, 420)">
    <rect x="-95" y="-42" width="190" height="84" rx="5" fill="#0C0C0F" stroke="#1C1C22"/>
    <!-- Status dot (amber, pulsing) -->
    <circle cx="-75" cy="-20" r="3" fill="#E8A84C" class="status-pulse"/>
    <text x="-66" y="-17" class="mono" font-size="7" fill="#E8A84C" opacity="0.6">in development</text>
    <!-- Title -->
    <text x="-75" y="2" font-size="12" font-weight="500" fill="#E4E4E7" letter-spacing="-0.01em">Mini NIDR</text>
    <!-- Stack -->
    <text x="-75" y="18" class="mono" font-size="8" fill="#44444D">Python · AF_PACKET · nftables</text>
    <!-- Detail -->
    <text x="-75" y="32" class="mono" font-size="7" fill="#2A2A32">zero-copy capture · sigma engine</text>
  </g>

  <!-- Node 4: Rubber Ducky Hunter (bottom-right) -->
  <g transform="translate(710, 425)">
    <rect x="-95" y="-42" width="190" height="84" rx="5" fill="#0C0C0F" stroke="#1C1C22"/>
    <!-- Status dot (blue, static) -->
    <circle cx="-75" cy="-20" r="3" fill="#5B9EE8" opacity="0.6"/>
    <text x="-66" y="-17" class="mono" font-size="7" fill="#5B9EE8" opacity="0.5">research</text>
    <!-- Title -->
    <text x="-75" y="2" font-size="12" font-weight="500" fill="#E4E4E7" letter-spacing="-0.01em">Rubber Ducky Hunter</text>
    <!-- Stack -->
    <text x="-75" y="18" class="mono" font-size="8" fill="#44444D">eBPF · USB HID · Linux</text>
    <!-- Detail -->
    <text x="-75" y="32" class="mono" font-size="7" fill="#2A2A32">kernel-level keystroke analysis</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       MEASUREMENT ANNOTATIONS (blueprint details)
       ═══════════════════════════════════════════════════════════ -->

  <!-- Vertical measurement (left margin) -->
  <g stroke="#1C1C22" stroke-width="0.5" opacity="0.4">
    <line x1="38" y1="110" x2="38" y2="194"/>
    <line x1="35" y1="110" x2="41" y2="110"/>
    <line x1="35" y1="194" x2="41" y2="194"/>
  </g>
  <text x="36" y="156" class="mono" font-size="6" fill="#1C1C22" text-anchor="end" transform="rotate(-90, 36, 156)">84px</text>

  <!-- Horizontal measurement (top) -->
  <g stroke="#1C1C22" stroke-width="0.5" opacity="0.4">
    <line x1="260" y1="95" x2="600" y2="95"/>
    <line x1="260" y1="92" x2="260" y2="98"/>
    <line x1="600" y1="92" x2="600" y2="98"/>
  </g>
  <text x="430" y="92" class="mono" font-size="6" fill="#1C1C22" text-anchor="middle">340px</text>

</svg>
