<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 32" width="100%">
  <defs>
    <clipPath id="clip">
      <rect x="100" y="0" width="1200" height="32"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: 'SF Mono','Cascadia Code','Fira Code',Consolas,'Courier New',monospace; }
    .signal { animation: signalTravel 10s linear infinite; }
    @keyframes signalTravel { from { transform: translateX(100px); } to { transform: translateX(1240px); } }
  </style>
  <rect width="1400" height="32" fill="#0B0F0D"/>
  <line x1="100" y1="16" x2="1300" y2="16" stroke="#1C2A24" stroke-width="0.5"/>
  <text x="400" y="20" class="mono" font-size="7" fill="#1C2A24" opacity="0.35" text-anchor="middle">&#x25C8;</text>
  <text x="1000" y="20" class="mono" font-size="7" fill="#1C2A24" opacity="0.35" text-anchor="middle">&#x25C8;</text>
  
  <g clip-path="url(#clip)">
    <rect y="15.25" width="60" height="1.5" rx="0.75" fill="#00FF9D" opacity="0.25" class="signal"/>
  </g>
</svg>
