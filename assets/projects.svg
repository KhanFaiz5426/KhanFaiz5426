<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" width="100%">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.5" fill="#9CA3AF" opacity="0.1"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1400" height="380" rx="10"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: 'SF Mono','Cascadia Code','Fira Code',Consolas,'Courier New',monospace; }
    .status-pulse { animation: statusPulse 2s ease-in-out infinite; }
    @keyframes statusPulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  </style>
  <rect width="1400" height="380" rx="10" fill="#0B0F0D"/>
  <rect width="1400" height="380" rx="10" fill="url(#dotGrid)"/>
  <rect width="1400" height="380" rx="10" fill="none" stroke="#1C2A24" stroke-width="1.5"/>
  
  <text x="40" y="27" class="mono" font-size="10.5" fill="#9CA3AF" letter-spacing="3" opacity="0.5">&#x25C8; ACTIVE OPERATIONS</text>
  <line x1="0" y1="42" x2="1400" y2="42" stroke="#1C2A24" stroke-width="0.75"/>
  
  <!-- CARD 1 -->
  <g transform="translate(40, 60)">
    <rect width="640" height="132" rx="6" fill="none" stroke="#1C2A24" stroke-width="0.75"/>
    <rect x="0" y="0" width="3" height="132" rx="1.5" fill="#00FF9D" opacity="0.3"/>
    <text x="20" y="18" class="mono" font-size="9" fill="#00FF9D" opacity="0.5" letter-spacing="2">OP-01</text>
    <text x="20" y="42" class="mono" font-size="14" fill="#D1D5DB">Linux Authentication Log Analyzer</text>
    <circle cx="23" cy="62" r="3" fill="#00FF9D" class="status-pulse"/>
    <text x="34" y="66" class="mono" font-size="10" fill="#00FF9D" letter-spacing="1">PRODUCTION</text>
    <text x="20" y="90" class="mono" font-size="10.5" fill="#9CA3AF" opacity="0.5">Anomaly detection in Linux authentication logs</text>
    
    <!-- Link area -->
    <a href="https://github.com/KhanFaiz5426/linux-auth-analyzer" target="_blank">
        <rect x="20" y="105" width="100" height="20" fill="transparent" cursor="pointer"/>
        <text x="20" y="118" class="mono" font-size="9" fill="#9CA3AF" opacity="0.4" letter-spacing="1">GITHUB_</text>
    </a>
  </g>
  
  <!-- CARD 2 -->
  <g transform="translate(720, 60)">
    <rect width="640" height="132" rx="6" fill="none" stroke="#1C2A24" stroke-width="0.75"/>
    <rect x="0" y="0" width="3" height="132" rx="1.5" fill="#00FF9D" opacity="0.3"/>
    <text x="20" y="18" class="mono" font-size="9" fill="#00FF9D" opacity="0.5" letter-spacing="2">OP-02</text>
    <text x="20" y="42" class="mono" font-size="14" fill="#D1D5DB">Windows Security Event Analyzer</text>
    <circle cx="23" cy="62" r="3" fill="#00FF9D" class="status-pulse"/>
    <text x="34" y="66" class="mono" font-size="10" fill="#00FF9D" letter-spacing="1">ACTIVE</text>
    <text x="20" y="90" class="mono" font-size="10.5" fill="#9CA3AF" opacity="0.5">Real-time Windows security event detection</text>
    
    <!-- Link area -->
    <a href="https://github.com/KhanFaiz5426/windows-event-analyzer" target="_blank">
        <rect x="20" y="105" width="100" height="20" fill="transparent" cursor="pointer"/>
        <text x="20" y="118" class="mono" font-size="9" fill="#9CA3AF" opacity="0.4" letter-spacing="1">GITHUB_</text>
    </a>
  </g>
  
  <!-- CARD 3 -->
  <g transform="translate(40, 216)">
    <rect width="640" height="132" rx="6" fill="none" stroke="#1C2A24" stroke-width="0.75"/>
    <rect x="0" y="0" width="3" height="132" rx="1.5" fill="#FBBF24" opacity="0.3"/>
    <text x="20" y="18" class="mono" font-size="9" fill="#FBBF24" opacity="0.5" letter-spacing="2">OP-03</text>
    <text x="20" y="42" class="mono" font-size="14" fill="#D1D5DB">SentinelX SIEM</text>
    <circle cx="23" cy="62" r="3" fill="#FBBF24"/>
    <text x="34" y="66" class="mono" font-size="10" fill="#FBBF24" letter-spacing="1">BUILDING</text>
    <text x="20" y="90" class="mono" font-size="10.5" fill="#9CA3AF" opacity="0.5">Lightweight SIEM for enterprise environments</text>

    <!-- Link area -->
    <a href="https://github.com/KhanFaiz5426/sentinelx-siem" target="_blank">
        <rect x="20" y="105" width="100" height="20" fill="transparent" cursor="pointer"/>
        <text x="20" y="118" class="mono" font-size="9" fill="#9CA3AF" opacity="0.4" letter-spacing="1">GITHUB_</text>
    </a>
  </g>
  
  <!-- CARD 4 -->
  <g transform="translate(720, 216)">
    <rect width="640" height="132" rx="6" fill="none" stroke="#1C2A24" stroke-width="0.75"/>
    <rect x="0" y="0" width="3" height="132" rx="1.5" fill="#60A5FA" opacity="0.3"/>
    <text x="20" y="18" class="mono" font-size="9" fill="#60A5FA" opacity="0.5" letter-spacing="2">OP-04</text>
    <text x="20" y="42" class="mono" font-size="14" fill="#D1D5DB">Rubber Ducky Hunter</text>
    <circle cx="23" cy="62" r="3" fill="#60A5FA"/>
    <text x="34" y="66" class="mono" font-size="10" fill="#60A5FA" letter-spacing="1">STABLE</text>
    <text x="20" y="90" class="mono" font-size="10.5" fill="#9CA3AF" opacity="0.5">USB-based HID attack payload detection</text>

    <!-- Link area -->
    <a href="https://github.com/KhanFaiz5426/rubber-ducky-hunter" target="_blank">
        <rect x="20" y="105" width="100" height="20" fill="transparent" cursor="pointer"/>
        <text x="20" y="118" class="mono" font-size="9" fill="#9CA3AF" opacity="0.4" letter-spacing="1">GITHUB_</text>
    </a>
