<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 550" width="100%">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.5" fill="#9CA3AF" opacity="0.1"/>
    </pattern>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00FF9D" stop-opacity="0.08"/>
      <stop offset="75%" stop-color="#00FF9D" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <rect width="1400" height="550" rx="10"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: 'SF Mono','Cascadia Code','Fira Code',Consolas,'Courier New',monospace; }
    .sans { font-family: 'Segoe UI',system-ui,-apple-system,sans-serif; }
    .scan-line { animation: scan 10s linear infinite; }
    @keyframes scan { from { transform: translateY(-10px); } to { transform: translateY(560px); } }
    .pulse-dot { animation: pulse 2.5s ease-in-out infinite; }
    @keyframes pulse { 0% { opacity: 0.55; } 50% { opacity: 0.15; } 100% { opacity: 0.55; } }
    .status-pulse { animation: statusPulse 2s ease-in-out infinite; }
    @keyframes statusPulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    .ring-expand { animation: ringExpand 2s infinite; }
    @keyframes ringExpand { 0% { r: 7px; opacity: 0.15; } 100% { r: 11px; opacity: 0.02; } }
    .load-bar { animation: loadBar 5s ease infinite; }
    @keyframes loadBar { 0% { width: 0px; } 30% { width: 270px; } 40% { width: 300px; } 85% { width: 300px; } 100% { width: 0px; } }
    .cursor-blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  <rect width="1400" height="550" rx="10" fill="#0B0F0D"/>
  <rect width="1400" height="550" rx="10" fill="url(#dotGrid)"/>
  <rect width="1400" height="550" rx="10" fill="none" stroke="#1C2A24" stroke-width="1.5"/>
  <g clip-path="url(#clip)">
    <rect class="scan-line" width="1400" height="1.5" fill="url(#scanGrad)"/>
  </g>
  
  <text x="40" y="29" class="mono" font-size="10.5" fill="#9CA3AF" letter-spacing="3" opacity="0.5">&#x25C8; SYSTEM ACCESS // DETECTION ENGINEERING</text>
  <line x1="0" y1="46" x2="1400" y2="46" stroke="#1C2A24" stroke-width="0.75"/>
  <circle cx="1326" cy="24" r="3" fill="#1C2A24"/>
  <circle cx="1343" cy="24" r="3" fill="#1C2A24"/>
  <circle cx="1360" cy="24" r="3" fill="#00FF9D" class="pulse-dot"/>
  
  <text x="700" y="200" class="sans" font-size="52" font-weight="600" letter-spacing="6" fill="#EDEDED" text-anchor="middle">FAIZ KHAN</text>
  <rect x="660" y="214" width="80" height="2" rx="1" fill="#00FF9D" opacity="0.55" filter="url(#glow)"/>
  <text x="700" y="255" class="mono" font-size="15" fill="#D1D5DB" letter-spacing="0.5" text-anchor="middle">Detection Engineer</text>
  <text x="700" y="280" class="mono" font-size="13" fill="#9CA3AF" opacity="0.65" text-anchor="middle">Python Security Developer</text>
  <text x="700" y="305" class="mono" font-size="13" fill="#9CA3AF" opacity="0.65" text-anchor="middle">Blue Team</text>
  <text x="700" y="352" class="mono" font-size="11.5" fill="#6B7280" letter-spacing="0.3" text-anchor="middle">Building modern detection engineering software.</text>
  
  <circle cx="52" cy="442" r="7" fill="none" stroke="#00FF9D" stroke-width="0.5" class="ring-expand"/>
  <circle cx="52" cy="442" r="3.5" fill="#00FF9D" class="status-pulse"/>
  <text x="66" y="446" class="mono" font-size="9" fill="#00FF9D" opacity="0.6" letter-spacing="1.5">SYSTEM ACTIVE</text>
  
  <rect x="550" y="440" width="300" height="3" rx="1.5" fill="#1C2A24"/>
  <rect x="550" y="440" width="0" height="3" rx="1.5" fill="#00FF9D" opacity="0.6" class="load-bar"/>
  
  <text x="1300" y="446" class="mono" font-size="9.5" fill="#00FF9D" opacity="0.7" text-anchor="end">&gt; READY</text>
  <rect x="1308" y="437" width="6" height="12" fill="#00FF9D" class="cursor-blink"/>
  
  <line x1="0" y1="500" x2="1400" y2="500" stroke="#1C2A24" stroke-width="0.5"/>
  <text x="40" y="530" class="mono" font-size="8" fill="#9CA3AF" opacity="0.2" letter-spacing="2">&#x25C8; IDENTIFICATION VERIFIED</text>
  <text x="1360" y="530" class="mono" font-size="8" fill="#9CA3AF" opacity="0.2" letter-spacing="2" text-anchor="end">FK-2024</text>
</svg>
