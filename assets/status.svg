<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 200" width="100%">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.5" fill="#9CA3AF" opacity="0.1"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1400" height="200" rx="10"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: 'SF Mono','Cascadia Code','Fira Code',Consolas,'Courier New',monospace; }
    .status-pulse { animation: statusPulse 2s ease-in-out infinite; }
    @keyframes statusPulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    .cursor-blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  <rect width="1400" height="200" rx="10" fill="#0B0F0D"/>
  <rect width="1400" height="200" rx="10" fill="url(#dotGrid)"/>
  <rect width="1400" height="200" rx="10" fill="none" stroke="#1C2A24" stroke-width="1.5"/>
  
  <text x="40" y="27" class="mono" font-size="10.5" fill="#9CA3AF" letter-spacing="3" opacity="0.5">&#x25C8; MISSION BRIEFING</text>
  <line x1="0" y1="42" x2="1400" y2="42" stroke="#1C2A24" stroke-width="0.75"/>
  
  <text x="56" y="80" class="mono" font-size="9.5" fill="#9CA3AF" opacity="0.4" letter-spacing="1.5">CURRENT OPERATION</text>
  <text x="280" y="80" class="mono" font-size="14" fill="#D1D5DB">Windows Security Event Analyzer</text>
  
  <text x="56" y="112" class="mono" font-size="9.5" fill="#9CA3AF" opacity="0.4" letter-spacing="1.5">STATUS</text>
  <circle cx="280" cy="108" r="3" fill="#00FF9D" class="status-pulse"/>
  <text x="294" y="112" class="mono" font-size="12" fill="#00FF9D" letter-spacing="1">ACTIVE</text>
  
  <text x="56" y="144" class="mono" font-size="9.5" fill="#9CA3AF" opacity="0.4" letter-spacing="1.5">FOCUS</text>
  <text x="280" y="144" class="mono" font-size="12" fill="#9CA3AF" opacity="0.65">Detection Engineering &#x00B7; Threat Hunting &#x00B7; SOC Automation</text>
  
  <text x="56" y="176" class="mono" font-size="9.5" fill="#9CA3AF" opacity="0.4" letter-spacing="1.5">NEXT DEPLOYMENT</text>
  <text x="280" y="176" class="mono" font-size="12" fill="#9CA3AF" opacity="0.65">IOC Detection Platform</text>
  <rect x="425" y="167" width="6" height="11" fill="#9CA3AF" class="cursor-blink"/>
</svg>
