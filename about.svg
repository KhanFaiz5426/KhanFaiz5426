<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap');
      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .label { font-weight: 500; font-size: 10px; fill: #10B981; letter-spacing: 0.3em; text-transform: uppercase; }
      .body { font-weight: 300; font-size: 15px; fill: #A1A1AA; line-height: 1.8; }
      .body b { font-weight: 500; fill: #E4E4E7; }
      .meta-label { font-weight: 500; font-size: 9px; fill: #52525B; letter-spacing: 0.25em; text-transform: uppercase; }
      .meta-val { font-weight: 400; font-size: 13px; fill: #A1A1AA; }
      .meta-accent { font-weight: 500; fill: #10B981; }
      .pill { font-weight: 400; font-size: 11px; fill: #A1A1AA; }
      .line { stroke: #FFFFFF; stroke-opacity: 0.05; stroke-width: 1; }
      a { cursor: pointer; }
    </style>

    <linearGradient id="accent-scan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="scan-c"><rect x="120" y="12" width="760" height="6"/></clipPath>
  </defs>

  <rect width="1000" height="320" fill="#09090B"/>

  <!-- Divider -->
  <line x1="120" y1="15" x2="880" y2="15" class="line"/>
  <g clip-path="url(#scan-c)">
    <rect x="120" y="15" width="120" height="1" fill="url(#accent-scan)">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="760,0" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Section label -->
  <text x="120" y="55" class="label">ABOUT</text>

  <!-- Body text -->
  <text x="120" y="95" class="body">
    <tspan x="120" dy="0">Security engineer focused on</tspan>
    <tspan font-weight="500" fill="#E4E4E7">detection engineering</tspan><tspan>,</tspan>
    <tspan font-weight="500" fill="#E4E4E7"> threat hunting</tspan><tspan>,</tspan>
    <tspan> and building tools that protect</tspan>
    <tspan x="120" dy="26">endpoints at scale. I work across the detection lifecycle — from log</tspan>
    <tspan x="120" dy="26">ingestion and parsing to rule creation, tuning, and automated response.</tspan>
  </text>

  <!-- Focus areas -->
  <g transform="translate(120, 210)">
    <text x="0" y="0" class="meta-label">FOCUS AREAS</text>
    <text x="0" y="24" class="meta-val">
      <tspan class="meta-accent">Detection Engineering</tspan>
      <tspan fill="#3F3F46"> — </tspan>Threat Hunting
      <tspan fill="#3F3F46"> — </tspan>Security Automation
      <tspan fill="#3F3F46"> — </tspan>SOC Operations
      <tspan fill="#3F3F46"> — </tspan>Incident Response
    </text>
  </g>

  <!-- Tech stack -->
  <g transform="translate(120, 268)">
    <text x="0" y="0" class="meta-label">PRIMARY STACK</text>
    <g transform="translate(0, 22)">
      <text class="pill">Python</text>
      <text x="58" fill="#3F3F46">·</text>
      <text x="76" class="pill">Splunk</text>
      <text x="133" fill="#3F3F46">·</text>
      <text x="151" class="pill">Elastic</text>
      <text x="206" fill="#3F3F46">·</text>
      <text x="224" class="pill">Sigma</text>
      <text x="269" fill="#3F3F46">·</text>
      <text x="287" class="pill">YARA</text>
      <text x="330" fill="#3F3F46">·</text>
      <text x="348" class="pill">Sysmon</text>
      <text x="410" fill="#3F3F46">·</text>
      <text x="428" class="pill">FastAPI</text>
      <text x="490" fill="#3F3F46">·</text>
      <text x="508" class="pill">Docker</text>
      <text x="568" fill="#3F3F46">·</text>
      <text x="586" class="pill">Git</text>
    </g>
  </g>

  <!-- Corner marks -->
  <g stroke="#1A1A1E" stroke-width="1">
    <line x1="117" y1="15" x2="117" y2="21"/>
    <line x1="114" y1="15" x2="117" y2="15"/>
    <line x1="883" y1="15" x2="883" y2="21"/>
    <line x1="883" y1="15" x2="886" y2="15"/>
  </g>
</svg>
