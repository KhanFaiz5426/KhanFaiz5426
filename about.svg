<svg width="1000" height="380" viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap');
      
      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      
      .bg { fill: #0A0A0A; }
      
      .section-label {
        font-weight: 500;
        font-size: 10px;
        fill: #10B981;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }

      .about-text {
        font-weight: 300;
        font-size: 16px;
        fill: #A1A1AA;
        letter-spacing: -0.01em;
        line-height: 1.7;
      }

      .about-text-bold {
        font-weight: 500;
        fill: #E4E4E7;
      }

      .focus-label {
        font-weight: 500;
        font-size: 9px;
        fill: #52525B;
        letter-spacing: 0.25em;
        text-transform: uppercase;
      }

      .focus-value {
        font-weight: 400;
        font-size: 13px;
        fill: #D4D4D8;
        letter-spacing: 0.02em;
      }

      .focus-value-accent {
        font-weight: 500;
        fill: #10B981;
      }

      .tech-pill {
        font-weight: 400;
        font-size: 11px;
        fill: #A1A1AA;
        letter-spacing: 0.05em;
      }

      .divider-line {
        stroke: #FFFFFF;
        stroke-opacity: 0.04;
        stroke-width: 1;
      }

      /* Subtle scan animation */
      @keyframes scan {
        0% { transform: translateX(0); }
        100% { transform: translateX(760px); }
      }
      .scan-line {
        animation: 10s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* Clip for scan */
    </style>

    <clipPath id="scan-clip">
      <rect x="120" y="10" width="760" height="8" />
    </clipPath>

    <linearGradient id="scan-flare" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1000" height="380" class="bg" />

  <!-- Top divider -->
  <line x1="120" y1="14" x2="880" y2="14" class="divider-line" />
  
  <!-- Scan animation on divider -->
  <g clip-path="url(#scan-clip)">
    <rect x="0" y="14" width="200" height="1" fill="url(#scan-flare)" class="scan-line" />
  </g>

  <!-- Section label -->
  <text x="120" y="55" class="section-label">ABOUT</text>

  <!-- About text -->
  <g transform="translate(120, 90)">
    <text class="about-text">
      <tspan x="0" dy="0">Security engineer focused on <tspan class="about-text-bold">detection engineering</tspan>,</tspan>
      <tspan x="0" dy="28"><tspan class="about-text-bold">threat hunting</tspan>, and building tools that protect</tspan>
      <tspan x="0" dy="28">endpoints at scale. I work across the detection</tspan>
      <tspan x="0" dy="28">lifecycle—from log analysis to rule creation to</tspan>
      <tspan x="0" dy="28">automated response.</tspan>
    </text>
  </g>

  <!-- Focus Areas -->
  <g transform="translate(120, 245)">
    <text x="0" y="0" class="focus-label">FOCUS AREAS</text>
    <text x="0" y="28" class="focus-value">
      <tspan class="focus-value-accent">Detection Engineering</tspan>
      <tspan fill="#3F3F46"> — </tspan>
      <tspan>Threat Hunting</tspan>
      <tspan fill="#3F3F46"> — </tspan>
      <tspan>Security Automation</tspan>
      <tspan fill="#3F3F46"> — </tspan>
      <tspan>SOC Operations</tspan>
    </text>
  </g>

  <!-- Tech Stack Row -->
  <g transform="translate(120, 305)">
    <text x="0" y="0" class="focus-label">PRIMARY STACK</text>
    <g transform="translate(0, 25)">
      <!-- Tech pills with separators -->
      <text x="0" y="0" class="tech-pill">Python</text>
      <text x="55" y="0" fill="#27272A">·</text>
      <text x="72" y="0" class="tech-pill">Splunk</text>
      <text x="125" y="0" fill="#27272A">·</text>
      <text x="142" y="0" class="tech-pill">Elastic</text>
      <text x="193" y="0" fill="#27272A">·</text>
      <text x="210" y="0" class="tech-pill">Sigma</text>
      <text x="251" y="0" fill="#27272A">·</text>
      <text x="268" y="0" class="tech-pill">YARA</text>
      <text x="309" y="0" fill="#27272A">·</text>
      <text x="326" y="0" class="tech-pill">Sysmon</text>
      <text x="383" y="0" fill="#27272A">·</text>
      <text x="400" y="0" class="tech-pill">FastAPI</text>
      <text x="458" y="0" fill="#27272A">·</text>
      <text x="475" y="0" class="tech-pill">Docker</text>
      <text x="530" y="0" fill="#27272A">·</text>
      <text x="547" y="0" class="tech-pill">Git</text>
    </g>
  </g>

  <!-- Corner marks -->
  <g stroke="#27272A" stroke-width="1" opacity="0.3">
    <line x1="117" y1="14" x2="117" y2="22" />
    <line x1="113" y1="14" x2="117" y2="14" />
    <line x1="883" y1="14" x2="883" y2="22" />
    <line x1="883" y1="14" x2="887" y2="14" />
  </g>
</svg>
