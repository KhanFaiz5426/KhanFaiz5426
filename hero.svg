<svg width="1000" height="650" viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&amp;display=swap');
      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

      .name { font-weight: 200; font-size: 100px; fill: #FAFAFA; letter-spacing: -0.05em; }
      .name-bold { font-weight: 700; }
      .dot { fill: #10B981; }
      .role { font-weight: 400; font-size: 13px; fill: #A1A1AA; letter-spacing: 0.22em; text-transform: uppercase; }
      .role-sep { fill: #3F3F46; font-weight: 300; }
      .tagline { font-weight: 300; font-size: 17px; fill: #71717A; letter-spacing: -0.01em; }
      .brand { font-weight: 600; font-size: 10px; fill: #52525B; letter-spacing: 0.3em; }
      .brand-sep { fill: #27272A; font-weight: 300; }
      .status-label { font-weight: 500; font-size: 11px; fill: #52525B; letter-spacing: 0.15em; text-transform: uppercase; }
      .status-val { font-weight: 500; font-size: 12px; fill: #A1A1AA; }
      .cta-text { font-weight: 500; font-size: 11px; fill: #000; letter-spacing: 0.1em; text-transform: uppercase; }
      .cta-secondary { font-weight: 500; font-size: 11px; fill: #71717A; letter-spacing: 0.1em; text-transform: uppercase; }
      a { cursor: pointer; }

      @keyframes pulse { 0%,100% { opacity: 0.8; } 50% { opacity: 0.2; } }
      .pulse-ring { animation: pulse 3s ease-in-out infinite; }

      @keyframes dot-drift { from { transform: translateY(0); } to { transform: translateY(24px); } }
      .dot-bg { animation: dot-drift 30s linear infinite; }
    </style>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.5" fill="#FFFFFF" opacity="0.04"/>
    </pattern>

    <radialGradient id="glow" cx="75%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="top-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="650" fill="#09090B"/>
  <rect width="1000" height="674" fill="url(#dots)" class="dot-bg"/>
  <rect width="1000" height="650" fill="url(#glow)"/>
  <rect width="1000" height="1" fill="url(#top-line)"/>

  <!-- Brand -->
  <text x="60" y="50" class="brand">FK</text>
  <text x="82" y="50" class="brand-sep">/</text>
  <text x="94" y="50" class="brand">DETECTION ENGINEER</text>

  <!-- Name -->
  <text x="60" y="220" class="name">
    Faiz <tspan class="name-bold">Khan</tspan><tspan class="dot">.</tspan>
  </text>

  <!-- Role -->
  <text x="63" y="268" class="role">
    Detection Engineering <tspan class="role-sep">/</tspan> Blue Team <tspan class="role-sep">/</tspan> Threat Hunting
  </text>

  <!-- Tagline -->
  <text x="63" y="310" class="tagline">Building production-quality security tools that detect, protect, and respond.</text>

  <!-- Status -->
  <g transform="translate(63, 360)">
    <text x="0" y="0" class="status-label">STATUS</text>
    <g transform="translate(0, 18)">
      <circle cx="4" cy="5" r="10" fill="#10B981" opacity="0.1" class="pulse-ring"/>
      <circle cx="4" cy="5" r="4" fill="#10B981"/>
      <text x="16" y="9" class="status-val">Available for collaboration</text>
    </g>
  </g>

  <!-- CTAs -->
  <g transform="translate(63, 440)">
    <a href="#projects-section" target="_self">
      <rect x="0" y="0" width="160" height="42" rx="6" fill="#10B981"/>
      <text x="80" y="26" text-anchor="middle" class="cta-text">VIEW PROJECTS</text>
    </a>
    <a href="mailto:khanfaizmumbai@gmail.com">
      <rect x="176" y="0" width="160" height="42" rx="6" fill="none" stroke="#27272A" stroke-width="1"/>
      <text x="256" y="26" text-anchor="middle" class="cta-secondary">GET IN TOUCH</text>
    </a>
  </g>

  <!-- Subtle corner detail -->
  <line x1="940" y1="600" x2="940" y2="620" stroke="#1A1A1E" stroke-width="1"/>
  <line x1="920" y1="620" x2="940" y2="620" stroke="#1A1A1E" stroke-width="1"/>
</svg>
