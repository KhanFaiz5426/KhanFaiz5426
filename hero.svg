<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&amp;display=swap');
      
      * {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .hero-name {
        font-weight: 200;
        font-size: 120px;
        fill: #FFFFFF;
        letter-spacing: -0.05em;
      }

      .hero-name-bold {
        font-weight: 700;
      }

      .hero-dot {
        fill: #10B981;
      }

      .hero-role {
        font-weight: 400;
        font-size: 14px;
        fill: #A1A1AA;
        letter-spacing: 0.25em;
        text-transform: uppercase;
      }

      .hero-role-sep {
        fill: #27272A;
        font-weight: 300;
      }

      .hero-tagline {
        font-weight: 300;
        font-size: 18px;
        fill: #71717A;
        letter-spacing: -0.01em;
      }

      .status-label {
        font-weight: 500;
        font-size: 11px;
        fill: #52525B;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .status-value {
        font-weight: 500;
        font-size: 12px;
        fill: #A1A1AA;
        letter-spacing: 0.02em;
      }

      .cta-primary-text {
        font-weight: 500;
        font-size: 12px;
        fill: #FFFFFF;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .cta-secondary-text {
        font-weight: 500;
        font-size: 12px;
        fill: #71717A;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .brand-mark {
        font-weight: 600;
        font-size: 9px;
        fill: #3F3F46;
        letter-spacing: 0.3em;
      }

      /* Status pulse */
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.8); }
      }
      .status-pulse {
        animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: center;
      }

      /* Subtle dot grid animation */
      @keyframes grid-shift {
        0% { transform: translateY(0); }
        100% { transform: translateY(30px); }
      }
      .dot-grid {
        animation: grid-shift 20s linear infinite;
      }
    </style>

    <!-- Dot pattern -->
    <pattern id="dot-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.6" fill="#FFFFFF" opacity="0.03" />
    </pattern>

    <!-- Subtle radial vignette -->
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.8" />
    </radialGradient>

    <!-- Emerald glow for status -->
    <radialGradient id="status-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- CTA gradient -->
    <linearGradient id="cta-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Top border glow -->
    <linearGradient id="top-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="1000" height="700" fill="#0A0A0A" />
  
  <!-- Dot grid -->
  <g class="dot-grid">
    <rect width="1000" height="730" fill="url(#dot-grid)" />
  </g>
  
  <!-- Vignette -->
  <rect width="1000" height="700" fill="url(#vignette)" />

  <!-- Top accent line -->
  <rect x="0" y="0" width="1000" height="1" fill="url(#top-glow)" />

  <!-- Brand mark -->
  <text x="60" y="55" class="brand-mark">FK</text>
  <line x1="95" y1="50" x2="95" y2="58" stroke="#27272A" stroke-width="1" />
  <text x="108" y="55" class="brand-mark">DETECTION ENGINEER</text>

  <!-- Main content area -->
  <g transform="translate(60, 200)">
    <!-- Name -->
    <text x="0" y="0" class="hero-name">
      FAIZ<tspan class="hero-name-bold"> KHAN</tspan><tspan class="hero-dot">.</tspan>
    </text>

    <!-- Role -->
    <text x="5" y="65" class="hero-role">
      DETECTION ENGINEER <tspan class="hero-role-sep">/</tspan> BLUE TEAM <tspan class="hero-role-sep">/</tspan> THREAT HUNTING
    </text>

    <!-- Tagline -->
    <text x="5" y="110" class="hero-tagline">Building production-quality security tools that detect, protect, and respond.</text>
  </g>

  <!-- Status indicator -->
  <g transform="translate(60, 420)">
    <text x="0" y="0" class="status-label">CURRENTLY</text>
    
    <!-- Status dot with pulse -->
    <g transform="translate(0, 25)">
      <circle cx="5" cy="5" r="12" fill="url(#status-glow)" class="status-pulse" />
      <circle cx="5" cy="5" r="4" fill="#10B981" />
      <text x="18" y="9" class="status-value">Building detection engineering tools</text>
    </g>
  </g>

  <!-- CTA area -->
  <g transform="translate(60, 520)">
    <!-- Primary CTA -->
    <g>
      <rect x="0" y="0" width="180" height="44" rx="6" fill="url(#cta-gradient)" opacity="0.9" />
      <text x="90" y="27" text-anchor="middle" class="cta-primary-text">VIEW PROJECTS</text>
    </g>

    <!-- Secondary CTA -->
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="180" height="44" rx="6" fill="transparent" stroke="#27272A" stroke-width="1" />
      <text x="90" y="27" text-anchor="middle" class="cta-secondary-text">CONTACT</text>
    </g>
  </g>

  <!-- Decorative: minimal corner marks -->
  <g stroke="#27272A" stroke-width="1" opacity="0.5">
    <!-- Bottom right corner -->
    <line x1="940" y1="640" x2="940" y2="660" />
    <line x1="920" y1="660" x2="940" y2="660" />
  </g>
</svg>
