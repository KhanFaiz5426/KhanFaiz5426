<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap');
      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .label { font-weight: 500; font-size: 10px; fill: #10B981; letter-spacing: 0.3em; text-transform: uppercase; }
      .num { font-weight: 600; font-size: 10px; fill: #3F3F46; letter-spacing: 0.1em; }
      .title { font-weight: 600; font-size: 13px; fill: #FAFAFA; }
      .item { font-weight: 400; font-size: 12px; fill: #52525B; }
      .item-hi { font-weight: 500; fill: #A1A1AA; }
      .line { stroke: #FFFFFF; stroke-opacity: 0.05; stroke-width: 1; }
      .card { fill: #0D0D0F; }
      .card:hover { fill: #18181B; }
      .accent-bar { fill: #10B981; opacity: 0.5; }
    </style>
  </defs>

  <rect width="1000" height="400" fill="#09090B"/>

  <!-- Divider -->
  <line x1="120" y1="15" x2="880" y2="15" class="line"/>

  <!-- Label -->
  <text x="120" y="55" class="label">CAPABILITIES</text>

  <!-- 4-column grid with 1px gap borders -->
  <!-- Grid background (the border color) -->
  <rect x="120" y="80" width="760" height="260" rx="8" fill="#1A1A1E"/>

  <!-- Column backgrounds -->
  <!-- Col 1 -->
  <rect x="121" y="81" width="189" height="258" class="card" rx="7"/>
  <!-- Col 2 -->
  <rect x="311" y="81" width="189" height="258" class="card"/>
  <!-- Col 3 -->
  <rect x="501" y="81" width="189" height="258" class="card"/>
  <!-- Col 4 -->
  <rect x="691" y="81" width="188" height="258" class="card" rx="7"/>

  <!-- Col 1: Detection Engineering -->
  <g transform="translate(145, 110)">
    <text class="num">01</text>
    <text y="24" class="title">Detection</text>
    <text y="40" class="title">Engineering</text>
    <rect y="54" width="20" height="2" class="accent-bar" rx="1"/>
    <text y="78" class="item item-hi">Sigma Rules</text>
    <text y="100" class="item item-hi">YARA Patterns</text>
    <text y="122" class="item">KQL Queries</text>
    <text y="144" class="item">Splunk SPL</text>
    <text y="166" class="item">Detection-as-Code</text>
  </g>

  <!-- Col 2: Threat Intelligence -->
  <g transform="translate(336, 110)">
    <text class="num">02</text>
    <text y="24" class="title">Threat</text>
    <text y="40" class="title">Intelligence</text>
    <rect y="54" width="20" height="2" class="accent-bar" rx="1"/>
    <text y="78" class="item item-hi">IOC Analysis</text>
    <text y="100" class="item item-hi">Threat Hunting</text>
    <text y="122" class="item">MITRE ATT&CK</text>
    <text y="144" class="item">TTP Mapping</text>
    <text y="166" class="item">OSINT</text>
  </g>

  <!-- Col 3: Security Operations -->
  <g transform="translate(526, 110)">
    <text class="num">03</text>
    <text y="24" class="title">Security</text>
    <text y="40" class="title">Operations</text>
    <rect y="54" width="20" height="2" class="accent-bar" rx="1"/>
    <text y="78" class="item item-hi">Splunk Enterprise</text>
    <text y="100" class="item item-hi">Elastic SIEM</text>
    <text y="122" class="item">Log Analysis</text>
    <text y="144" class="item">Incident Response</text>
    <text y="166" class="item">Alert Triage</text>
  </g>

  <!-- Col 4: Engineering -->
  <g transform="translate(716, 110)">
    <text class="num">04</text>
    <text y="24" class="title">Engineering</text>
    <rect y="38" width="20" height="2" class="accent-bar" rx="1"/>
    <text y="62" class="item item-hi">Python</text>
    <text y="84" class="item item-hi">FastAPI</text>
    <text y="106" class="item">Docker</text>
    <text y="128" class="item">Git</text>
    <text y="150" class="item">Linux / Windows</text>
  </g>

  <!-- Bottom divider -->
  <line x1="120" y1="385" x2="880" y2="385" class="line"/>
</svg>
