<svg width="880" height="400" viewBox="0 0 880 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400&amp;family=JetBrains+Mono:wght@400&amp;display=swap');

      * { font-family: 'Inter', -apple-system, sans-serif; }
      .serif { font-family: 'Instrument Serif', Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }

      /* The single structural animation */
      @keyframes draw-structure {
        0% { stroke-dashoffset: 400; opacity: 0; }
        20% { opacity: 0.15; }
        80% { opacity: 0.15; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .structural-line {
        stroke-dasharray: 400;
        animation: draw-structure 40s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
      }

      /* The Single Travelling Highlight */
      @keyframes highlight-travel {
        0% { stroke-dashoffset: 3500; }
        100% { stroke-dashoffset: 0; }
      }
      .dragon-highlight {
        fill: none;
        stroke: #7A3B3B; /* Elegant, muted burgundy */
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-dasharray: 60 3500; /* Tiny pulse of light, massive gap */
        animation: highlight-travel 18s linear infinite;
      }

      .dragon-base {
        fill: none;
        stroke: #FFFFFF;
        stroke-opacity: 0.05;
        stroke-width: 0.5;
      }
    </style>

    <!-- The continuous abstract vector path forming the recognizable guardian silhouette -->
    <!-- It sweeps gracefully to form a tail, belly, neck, snout, horn, and arched wing -->
    <path id="dragon-silhouette" d="M 650 350 C 450 400 300 400 200 320 C 100 240 100 150 150 100 C 140 80 130 60 160 50 C 190 40 220 30 210 70 C 200 110 220 140 320 100 C 450 50 600 20 750 100 C 850 150 750 200 650 180 C 750 250 700 300 600 280 C 500 260 450 320 500 350 C 550 380 600 360 650 350" />
  </defs>

  <!-- Solid, deep matte background. No gradients. No glow. -->
  <rect width="880" height="400" fill="#0A0A0C"/>

  <!-- ═══════════════════════════════════════════════════════════
       THE ABSTRACT GUARDIAN
       Sits behind the typography. One continuous, faint stroke.
       ═══════════════════════════════════════════════════════════ -->
  <g>
    <!-- The very faint, continuous structural path -->
    <use href="#dragon-silhouette" class="dragon-base" />
    
    <!-- The single travelling highlight (telemetry / electrical current) -->
    <use href="#dragon-silhouette" class="dragon-highlight" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       THE STRUCTURE
       A single line separating Identity from Metadata.
       ═══════════════════════════════════════════════════════════ -->
  <g>
    <!-- Base line (faint) -->
    <line x1="340" y1="60" x2="340" y2="340" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="0.5" />
    
    <!-- Animated tracing line -->
    <line x1="340" y1="60" x2="340" y2="340" stroke="#FFFFFF" stroke-width="0.5" class="structural-line" />
    
    <!-- The Signature Motif: A single microscopic registration crosshair -->
    <path d="M 338,220 L 342,220 M 340,218 L 340,222" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.5" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       THE IDENTITY (Left Hemisphere)
       ═══════════════════════════════════════════════════════════ -->
  <g transform="translate(300, 220)">
    <!-- Typography is the hero. Set in an elegant, high-contrast serif. -->
    <text x="0" y="0" text-anchor="end" class="serif" font-size="64" font-weight="400" fill="#FFFFFF" letter-spacing="-0.02em">Faiz Khan.</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       THE METADATA (Right Hemisphere)
       ═══════════════════════════════════════════════════════════ -->
  <g transform="translate(380, 0)">
    <!-- Role (Microscopic, precise) -->
    <text x="0" y="190" class="mono" font-size="10" font-weight="400" fill="#71717A" letter-spacing="0.3em">DETECTION ENGINEER</text>

    <!-- The Authentic Statement (Perfectly baseline-aligned with the Name) -->
    <text x="0" y="220" font-size="14" font-weight="300" fill="#D4D4D8" letter-spacing="0.01em">Building systems for threat detection.</text>

    <!-- Essential Contact Information (Removed LinkedIn and Resume) -->
    <text x="0" y="260" class="mono" font-size="10" fill="#52525B" letter-spacing="0.05em">khanfaizmumbai@gmail.com</text>
  </g>

</svg>
