<svg width="880" height="600" viewBox="0 0 880 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400&amp;family=JetBrains+Mono:wght@300;400&amp;display=swap');

      * { font-family: 'Inter', -apple-system, sans-serif; }
      .serif { font-family: 'Instrument Serif', Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }

      /* Elegant, slow drawing animation for the topology lines */
      @keyframes trace-path {
        0% { stroke-dashoffset: 1500; opacity: 0; }
        15% { opacity: 0.15; }
        85% { opacity: 0.15; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }

      .dragon-topology {
        fill: none;
        stroke: #E4E4E7;
        stroke-width: 0.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1500;
        animation: trace-path 25s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
      }

      /* Base structure with very faint opacity */
      .dragon-base {
        fill: none;
        stroke: #A1A1AA;
        stroke-width: 0.5;
        opacity: 0.04;
      }

      /* Slow fade for particles flowing through the network */
      @keyframes node-flow {
        0% { opacity: 0; }
        20% { opacity: 0.6; }
        80% { opacity: 0.6; }
        100% { opacity: 0; }
      }
      .telemetry-node {
        fill: #FFFFFF;
        animation: node-flow 12s ease-in-out infinite;
      }
    </style>

    <radialGradient id="bg-glow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#121216" stop-opacity="1"/>
      <stop offset="100%" stop-color="#08080A" stop-opacity="1"/>
    </radialGradient>

    <!-- Paths for animation referencing -->
    <path id="dragon-path-1" d="M 520,150 L 560,120 L 580,80 L 560,130 C 500,180 480,240 450,320 C 500,240 600,160 720,200 C 780,240 820,320 780,400 C 680,360 580,380 500,440 C 450,360 400,400 380,480 C 350,560 400,620 500,600 C 600,580 650,520 700,550" />
    <path id="dragon-path-2" d="M 510,160 L 550,130 L 570,90 L 550,140 C 490,190 470,250 440,330 C 490,250 590,170 710,210 C 770,250 810,330 770,410 C 670,370 570,390 490,450 C 440,370 390,410 370,490 C 340,570 390,630 490,610 C 590,590 640,530 690,560" />
    <path id="dragon-path-3" d="M 530,140 L 570,110 L 590,70 L 570,120 C 510,170 490,230 460,310 C 510,230 610,150 730,190 C 790,230 830,310 790,390 C 690,350 590,370 510,430 C 460,350 410,390 390,470 C 360,550 410,610 510,590 C 610,570 660,510 710,540" />
  </defs>

  <rect width="880" height="600" fill="url(#bg-glow)"/>

  <!-- ═══════════════════════════════════════════════════════════
       THE GUARDIAN SILHOUETTE (Abstract Engineering Lines)
       ═══════════════════════════════════════════════════════════ -->
  <g>
    <!-- Base structural lines (always faintly visible) -->
    <use href="#dragon-path-1" class="dragon-base" />
    <use href="#dragon-path-2" class="dragon-base" />
    <use href="#dragon-path-3" class="dragon-base" />

    <!-- Animated tracing lines (The delayed recognition effect) -->
    <use href="#dragon-path-1" class="dragon-topology" />
    <use href="#dragon-path-2" class="dragon-topology" style="animation-delay: -8s; animation-duration: 28s;" />
    <use href="#dragon-path-3" class="dragon-topology" style="animation-delay: -16s; animation-duration: 32s;" />

    <!-- Additional supporting topology geometry (Adds to the "engineering" feel) -->
    <path class="dragon-base" d="M 450,320 L 500,440" />
    <path class="dragon-base" d="M 440,330 L 490,450" />
    <path class="dragon-base" d="M 460,310 L 510,430" />
    
    <path class="dragon-base" d="M 720,200 L 780,400" />
    <path class="dragon-base" d="M 710,210 L 770,410" />
    <path class="dragon-base" d="M 730,190 L 790,390" />

    <!-- Telemetry particles flowing along the curves -->
    <circle r="1.5" class="telemetry-node" style="animation-duration: 18s;">
      <animateMotion dur="18s" repeatCount="indefinite">
        <mpath href="#dragon-path-1" />
      </animateMotion>
    </circle>
    
    <circle r="2" class="telemetry-node" style="animation-duration: 24s; animation-delay: -6s;">
      <animateMotion dur="24s" repeatCount="indefinite">
        <mpath href="#dragon-path-2" />
      </animateMotion>
    </circle>
    
    <circle r="1" class="telemetry-node" style="animation-duration: 15s; animation-delay: -12s;">
      <animateMotion dur="15s" repeatCount="indefinite">
        <mpath href="#dragon-path-3" />
      </animateMotion>
    </circle>
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       TYPOGRAPHY (The Magazine Cover)
       Perfectly scaled to fit the viewport comfortably
       ═══════════════════════════════════════════════════════════ -->
  <g transform="translate(80, 260)">
    <!-- Name -->
    <text y="0" class="serif" font-size="80" font-weight="400" fill="#FFFFFF" letter-spacing="-0.02em" style="text-shadow: 0px 4px 24px rgba(0,0,0,0.8);">Faiz Khan.</text>
    
    <!-- Role -->
    <text x="4" y="40" class="mono" font-size="10" font-weight="400" fill="#A1A1AA" letter-spacing="0.3em">DETECTION ENGINEER</text>

    <!-- The Authentic Statement -->
    <text x="4" y="80" font-size="14" font-weight="300" fill="#D4D4D8" letter-spacing="0.01em" style="text-shadow: 0px 2px 10px rgba(0,0,0,0.5);">Building systems for threat detection.</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       MINIMAL SIGN-OFF
       ═══════════════════════════════════════════════════════════ -->
  <g transform="translate(80, 530)" class="mono" font-size="10" fill="#71717A" letter-spacing="0.05em">
    <text x="0" y="0">khanfaizmumbai@gmail.com</text>
    <text x="180" y="0">·</text>
    <text x="200" y="0">linkedin</text>
    <text x="270" y="0">·</text>
    <text x="290" y="0">resume</text>
  </g>

  <!-- Elegant structural border marks (Adds to the handcrafted feel) -->
  <g stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="0.5">
    <!-- Top Left -->
    <line x1="40" y1="40" x2="56" y2="40"/>
    <line x1="40" y1="40" x2="40" y2="56"/>
    <!-- Bottom Right -->
    <line x1="840" y1="560" x2="824" y2="560"/>
    <line x1="840" y1="560" x2="840" y2="544"/>
  </g>

</svg>
