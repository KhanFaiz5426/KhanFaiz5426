<svg width="880" height="600" viewBox="0 0 880 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400&amp;family=JetBrains+Mono:wght@400&amp;display=swap');

      * { font-family: 'Inter', -apple-system, sans-serif; }
      .serif { font-family: 'Instrument Serif', Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }

      .shield-line {
        fill: none;
        stroke: #3BA8FF;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .shield-glow {
        fill: none;
        stroke: #3BA8FF;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: .26;
        filter: url(#shield-glow);
      }
      .shield { opacity: 1; }
      .outline-second { opacity: .7; }
      .outline-third { opacity: .45; }
      .outline-fourth { opacity: .25; }
      .outline-inner { opacity: .15; }
      .circuit-pulse {
        fill: none;
        stroke: #B9EAFF;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 7 93;
        stroke-dashoffset: 100;
        filter: url(#pulse-glow);
        animation: outer-scan 8s linear infinite;
      }
      .scan-node {
        fill: none;
        stroke: #D5F4FF;
        stroke-width: 1.2;
        stroke-linejoin: round;
        filter: url(#node-glow);
        animation: packet-visibility 8s linear infinite;
      }

      @keyframes outer-scan {
        0% { opacity: 0; stroke-dashoffset: 100; }
        7% { opacity: .9; }
        82% { opacity: .9; stroke-dashoffset: 0; }
        88%, 100% { opacity: 0; stroke-dashoffset: 0; }
      }
      @keyframes packet-visibility {
        0% { opacity: 0; }
        7%, 82% { opacity: .95; }
        88%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .circuit-pulse, .scan-node { animation: none; }
      }
    </style>

    <filter id="shield-glow" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="1.7" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="pulse-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="node-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="1.4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <!-- All path commands are straight-line routing commands. -->
    <path id="shield-outline" pathLength="100" d="M 590 145 H 730 L 780 195 L 760 335 L 660 465 L 560 335 L 540 195 Z" />
  </defs>

  <!-- Right column: centered against the complete text block, not a single text line. -->
  <g class="shield" transform="translate(700 354) scale(.81) translate(-660 -305)" aria-label="Concentric cybersecurity shield">
    <g class="shield-line">
      <use href="#shield-outline" />
      <use href="#shield-outline" class="outline-second" transform="translate(660 305) scale(.82) translate(-660 -305)" />
      <use href="#shield-outline" class="outline-third" transform="translate(660 305) scale(.64) translate(-660 -305)" />
      <use href="#shield-outline" class="outline-fourth" transform="translate(660 305) scale(.46) translate(-660 -305)" />
      <use href="#shield-outline" class="outline-inner" transform="translate(660 305) scale(.28) translate(-660 -305)" />
    </g>
    <g class="shield-glow">
      <use href="#shield-outline" />
      <use href="#shield-outline" class="outline-second" transform="translate(660 305) scale(.82) translate(-660 -305)" />
      <use href="#shield-outline" class="outline-third" transform="translate(660 305) scale(.64) translate(-660 -305)" />
      <use href="#shield-outline" class="outline-fourth" transform="translate(660 305) scale(.46) translate(-660 -305)" />
      <use href="#shield-outline" class="outline-inner" transform="translate(660 305) scale(.28) translate(-660 -305)" />
    </g>

    <!-- The sole animated element: a slow integrity packet on the outer rim. -->
    <use href="#shield-outline" class="circuit-pulse" />
    <polygon class="scan-node" points="-2,0 0,-2 2,0 0,2">
      <animateMotion dur="8s" repeatCount="indefinite" rotate="0" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.82;1">
        <mpath href="#shield-outline" />
      </animateMotion>
    </polygon>
  </g>

  <!-- Left column: all typography lives in one aligned 352px content block. -->
  <g id="content-column" transform="translate(110, 300)" aria-label="Profile content">
    <text x="0" y="0" class="serif" font-size="72" font-weight="400" fill="#FFFFFF" letter-spacing="0.01em">Faiz Khan.</text>
    <line x1="0" y1="40" x2="280" y2="40" stroke="#3BA8FF" stroke-width="0.5" stroke-opacity="0.4" />
    <polygon points="140,37.5 142.5,40 140,42.5 137.5,40" fill="#3BA8FF" filter="url(#node-glow)" />
    <text x="0" y="85" class="mono" font-size="12" font-weight="400" fill="#3BA8FF" letter-spacing="0.4em">DETECTION ENGINEER</text>
    <text x="0" y="125" font-size="14" font-weight="300" fill="#E4E4E7" letter-spacing="0.01em">Building systems for threat detection.</text>
    <text x="0" y="165" class="mono" font-size="12" fill="#A1A1AA" opacity="0.45">khanfaizmumbai@gmail.com</text>
  </g>
</svg>
