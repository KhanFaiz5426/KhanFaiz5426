<svg width="880" height="400" viewBox="0 0 880 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400&amp;family=JetBrains+Mono:wght@400&amp;display=swap');

      * { font-family: 'Inter', -apple-system, sans-serif; }
      .serif { font-family: 'Instrument Serif', Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }

      /* The structural line drawing itself */
      @keyframes draw-structure {
        0% { stroke-dashoffset: 400; opacity: 0; }
        20% { opacity: 0.15; }
        80% { opacity: 0.15; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .structural-line {
        stroke-dasharray: 400;
        animation: draw-structure 40s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
      }

      /* 
         THE FRACTURE ANIMATION
         The upper right edge remains completely stable for several seconds,
         fractures (translates and fades), and then instantly reforms.
      */
      @keyframes shield-fracture {
        0%, 75% { transform: translate(0, 0); opacity: 1; }
        78% { transform: translate(15px, -15px); opacity: 0; }
        88% { transform: translate(0, 0); opacity: 0; }
        90% { opacity: 1; }
        100% { opacity: 1; }
      }
      .fracture-part {
        animation: shield-fracture 16s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }

      /* 
         THE PARTICLES ANIMATION
         Fragments detach and dissolve as the shield edge fractures.
      */
      @keyframes particle-dissolve {
        0%, 75% { opacity: 0; transform: translate(0, 0) scale(1); }
        77% { opacity: 0.8; transform: translate(10px, -10px) scale(1); }
        82% { opacity: 0; transform: translate(30px, -30px) scale(0); }
        100% { opacity: 0; }
      }
      .particle {
        fill: #FFFFFF;
        fill-opacity: 0.15;
        animation: particle-dissolve 16s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }

      /* 
         THE TELEMETRY PULSE
         A single tiny pulse travelling through the network edges.
      */
      @keyframes telemetry-pulse {
        0% { stroke-dashoffset: 1500; }
        100% { stroke-dashoffset: 0; }
      }
      .telemetry {
        stroke: #7A3B3B; /* Muted Burgundy Accent */
        stroke-width: 1.5;
        stroke-dasharray: 40 1500;
        fill: none;
        animation: telemetry-pulse 15s linear infinite;
      }

      /* Base styling for the wireframe shield */
      .shield-line {
        stroke: #FFFFFF;
        stroke-opacity: 0.08;
        stroke-width: 0.5;
        fill: none;
      }
      .shield-node {
        fill: #FFFFFF;
        fill-opacity: 0.2;
      }
    </style>
  </defs>

  <!-- Solid, deep matte background. -->
  <rect width="880" height="400" fill="#0A0A0C"/>

  <!-- ═══════════════════════════════════════════════════════════
       THE WIREFRAME SHIELD (Signature Identity)
       Sits completely behind the typography.
       Centered exactly on the structural line (X=340).
       ═══════════════════════════════════════════════════════════ -->
  <g>
    <!-- BASE NETWORK (Static Lines) -->
    <path class="shield-line" d="
      M 200 80 L 340 100 
      M 160 200 L 200 80 
      M 160 200 L 340 360 
      M 340 360 L 520 200 
      M 260 140 L 200 80 
      M 260 140 L 160 200 
      M 260 140 L 340 160 
      M 260 140 L 340 260 
      M 420 140 L 340 160 
      M 420 140 L 340 260 
      M 340 260 L 340 360 
      M 340 260 L 160 200 
      M 340 260 L 520 200 
      M 340 160 L 340 100 
      M 160 200 L 340 160 
      M 520 200 L 340 160 
      M 200 80 L 340 160
    " />

    <!-- FRACTURING SEGMENT (Upper-Right Edge) -->
    <g class="fracture-part">
      <!-- Network lines that detach -->
      <path class="shield-line" d="
        M 340 100 L 480 80 
        M 480 80 L 520 200 
        M 420 140 L 480 80
      " />
      <!-- The detaching node -->
      <circle cx="480" cy="80" r="1.5" class="shield-node" />
    </g>

    <!-- DISSOLVING PARTICLES -->
    <g>
      <polygon points="480,80 490,75 485,90" class="particle" style="animation-delay: 0.1s" />
      <polygon points="450,110 465,105 455,120" class="particle" style="animation-delay: 0s" />
      <circle cx="430" cy="100" r="1.5" class="particle" style="animation-delay: 0.2s" />
      <circle cx="470" cy="130" r="1" class="particle" style="animation-delay: 0.15s" />
      <polygon points="400,90 410,85 405,100" class="particle" style="animation-delay: 0.05s" />
    </g>

    <!-- STATIC NODES (The rest of the vertices) -->
    <g class="shield-node">
      <circle cx="200" cy="80" r="1.5" />
      <circle cx="340" cy="100" r="1.5" />
      <circle cx="520" cy="200" r="1.5" />
      <circle cx="340" cy="360" r="1.5" />
      <circle cx="160" cy="200" r="1.5" />
      <circle cx="340" cy="160" r="1.5" />
      <circle cx="260" cy="140" r="1.5" />
      <circle cx="420" cy="140" r="1.5" />
      <circle cx="340" cy="260" r="1.5" />
    </g>

    <!-- TELEMETRY PULSE (Travelling along the network) -->
    <path class="telemetry" d="M 160 200 L 260 140 L 340 160 L 420 140 L 520 200 L 340 260 L 340 360" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       THE STRUCTURE
       A single line separating Identity from Metadata.
       ═══════════════════════════════════════════════════════════ -->
  <g>
    <!-- Base line (faint) -->
    <line x1="340" y1="60" x2="340" y2="340" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="0.5" />
    
    <!-- Animated tracing line -->
    <line x1="340" y1="60" x2="340" y2="340" stroke="#FFFFFF" stroke-width="0.5" class="structural-line" />
    
    <!-- The Signature Motif: A single microscopic registration crosshair -->
    <path d="M 338,220 L 342,220 M 340,218 L 340,222" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.5" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       THE IDENTITY (Left Hemisphere)
       ═══════════════════════════════════════════════════════════ -->
  <g transform="translate(300, 220)">
    <!-- Typography is the hero. Set in an elegant, high-contrast serif. -->
    <text x="0" y="0" text-anchor="end" class="serif" font-size="64" font-weight="400" fill="#FFFFFF" letter-spacing="-0.02em">Faiz Khan.</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       THE METADATA (Right Hemisphere)
       ═══════════════════════════════════════════════════════════ -->
  <g transform="translate(380, 0)">
    <!-- Role (Microscopic, precise) -->
    <text x="0" y="190" class="mono" font-size="10" font-weight="400" fill="#71717A" letter-spacing="0.3em">DETECTION ENGINEER</text>

    <!-- The Authentic Statement (Perfectly baseline-aligned with the Name) -->
    <text x="0" y="220" font-size="14" font-weight="300" fill="#D4D4D8" letter-spacing="0.01em">Building systems for threat detection.</text>

    <!-- Essential Contact Information (Email only) -->
    <text x="0" y="260" class="mono" font-size="10" fill="#52525B" letter-spacing="0.05em">khanfaizmumbai@gmail.com</text>
  </g>

</svg>
