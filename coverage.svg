<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500&amp;display=swap');
      
      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .bg { fill: #070908; }
      
      .section-title {
        font-weight: 500; 
        font-size: 10px; 
        fill: #8892B0; 
        letter-spacing: 0.35em; 
      }
      
      .domain-annotation {
        font-weight: 500; 
        font-size: 9px; 
        fill: #5A6660; 
        letter-spacing: 0.25em; 
      }
      
      .domain-title {
        font-weight: 200; 
        font-size: 32px; 
        fill: #FFFFFF; 
        letter-spacing: -0.02em; 
      }
      
      .domain-sub {
        font-weight: 500; 
        font-size: 9px; 
        fill: #8892B0; 
        letter-spacing: 0.2em; 
      }

      .panel-rect {
        fill: transparent;
        transition: fill 0.4s ease;
      }
      .panel-group:hover .panel-rect {
        fill: rgba(255, 255, 255, 0.015);
      }
      
      /* Intentional asymmetrical shading for the lower-left block */
      .intentional-shade {
        fill: rgba(255, 255, 255, 0.02);
      }
      .panel-group:hover .intentional-shade {
        fill: rgba(255, 255, 255, 0.035);
      }
      
      @keyframes sweep {
        0% { transform: translateX(0px); }
        100% { transform: translateX(900px); }
      }
      .divider-scan {
        animation: sweep 12s cubic-bezier(0.2, 0, 0.2, 1) infinite;
      }

      @keyframes crosshair-breathe {
        0%, 100% { stroke-opacity: 0.1; }
        50% { stroke-opacity: 0.3; }
      }
      .crosshair {
        animation: crosshair-breathe 8s ease-in-out infinite;
      }
    </style>
    
    <linearGradient id="flare-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <clipPath id="mid-divider-clip">
      <rect x="120" y="270" width="760" height="20" />
    </clipPath>

    <radialGradient id="depth-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1000" height="560" class="bg" />
  <rect width="1000" height="560" fill="url(#depth-glow)" style="pointer-events: none;" />

  <!-- Section Anchor with Restrained Emerald Accent -->
  <text x="120" y="45" class="section-title">DETECTION DOMAINS<tspan fill="#00FF9D">.</tspan></text>

  <!-- ARCHITECTURAL GRID -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="120" y1="80" x2="880" y2="80" />
    <line x1="120" y1="280" x2="880" y2="280" />
    <line x1="120" y1="480" x2="880" y2="480" />
    <line x1="500" y1="80" x2="500" y2="480" />
  </g>

  <!-- Animated Scan Across the Central Architectural Divider -->
  <g clip-path="url(#mid-divider-clip)">
    <rect x="0" y="280" width="350" height="1" fill="url(#flare-gradient)" class="divider-scan" />
  </g>

  <!-- Precision Crosshairs -->
  <g class="crosshair" stroke="#ffffff" stroke-width="1">
    <path d="M 497 80 L 503 80 M 500 77 L 500 83" />
    <path d="M 497 280 L 503 280 M 500 277 L 500 283" />
    <path d="M 497 480 L 503 480 M 500 477 L 500 483" />
    
    <path d="M 117 80 L 123 80 M 120 77 L 120 83" />
    <path d="M 877 80 L 883 80 M 880 77 L 880 83" />
    
    <path d="M 117 280 L 123 280 M 120 277 L 120 283" />
    <path d="M 877 280 L 883 280 M 880 277 L 880 283" />

    <path d="M 117 480 L 123 480 M 120 477 L 120 483" />
    <path d="M 877 480 L 883 480 M 880 477 L 880 483" />
  </g>

  <!-- PANELS -->
  
  <!-- 01: Windows -->
  <g class="panel-group">
    <rect x="120.5" y="80.5" width="379" height="199" class="panel-rect" />
    <g transform="translate(160, 130)">
      <text x="0" y="0" class="domain-annotation">OPERATING DOMAIN</text>
      <text x="0" y="50" class="domain-title">Windows Detection</text>
      <text x="0" y="100" class="domain-sub">SYSMON • WINDOWS EVENTS • POWERSHELL</text>
    </g>
  </g>

  <!-- 02: Linux -->
  <g class="panel-group">
    <rect x="500.5" y="80.5" width="379" height="199" class="panel-rect" />
    <g transform="translate(540, 130)">
      <text x="0" y="0" class="domain-annotation">OPERATING DOMAIN</text>
      <text x="0" y="50" class="domain-title">Linux Detection</text>
      <text x="0" y="100" class="domain-sub">AUTH.LOG • AUDITD • SSH</text>
    </g>
  </g>

  <!-- 03: SIEM (Intentionally Shaded) -->
  <g class="panel-group">
    <!-- The intentional 2% lighter shade applied here -->
    <rect x="120.5" y="280.5" width="379" height="199" class="panel-rect intentional-shade" />
    <g transform="translate(160, 330)">
      <text x="0" y="0" class="domain-annotation">SECURITY OPERATIONS</text>
      <text x="0" y="50" class="domain-title">SIEM</text>
      <text x="0" y="100" class="domain-sub">CORRELATION • PARSING • DETECTION RULES</text>
    </g>
  </g>

  <!-- 04: Threat Hunting -->
  <g class="panel-group">
    <rect x="500.5" y="280.5" width="379" height="199" class="panel-rect" />
    <g transform="translate(540, 330)">
      <text x="0" y="0" class="domain-annotation">ACTIVE INITIATIVE</text>
      <text x="0" y="50" class="domain-title">Threat Hunting</text>
      <text x="0" y="100" class="domain-sub">IOC ANALYSIS • BEHAVIOR • INVESTIGATION</text>
    </g>
  </g>

</svg>
