<svg width="1000" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap');
      
      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      
      .bg { fill: #0A0A0A; }
      
      .section-label {
        font-weight: 500;
        font-size: 10px;
        fill: #10B981;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }

      .card-bg {
        fill: rgba(255, 255, 255, 0.02);
        stroke: rgba(255, 255, 255, 0.04);
        stroke-width: 1;
        rx: 8;
      }

      .card-bg:hover {
        fill: rgba(255, 255, 255, 0.04);
        stroke: rgba(255, 255, 255, 0.08);
      }

      .project-number {
        font-weight: 600;
        font-size: 10px;
        fill: #27272A;
        letter-spacing: 0.1em;
      }

      .project-title {
        font-weight: 600;
        font-size: 18px;
        fill: #FFFFFF;
        letter-spacing: -0.02em;
      }

      .project-desc {
        font-weight: 400;
        font-size: 13px;
        fill: #71717A;
        line-height: 1.6;
      }

      .project-label {
        font-weight: 500;
        font-size: 9px;
        fill: #52525B;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .tech-tag {
        font-weight: 400;
        font-size: 11px;
        fill: #A1A1AA;
        letter-spacing: 0.03em;
      }

      .tech-tag-sep {
        fill: #3F3F46;
      }

      .link-text {
        font-weight: 500;
        font-size: 11px;
        fill: #52525B;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .link-text-primary {
        fill: #10B981;
      }

      .link-arrow {
        fill: #10B981;
        font-weight: 400;
      }

      .divider-line {
        stroke: #FFFFFF;
        stroke-opacity: 0.04;
        stroke-width: 1;
      }

      .card-hover-area {
        cursor: pointer;
      }
    </style>

    <!-- Card glow for hover -->
    <filter id="card-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feFlood flood-color="#10B981" flood-opacity="0.05" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="620" class="bg" />

  <!-- Top divider -->
  <line x1="120" y1="14" x2="880" y2="14" class="divider-line" />

  <!-- Section label -->
  <text x="120" y="55" class="section-label">PROJECTS</text>

  <!-- Project 1: Windows Event Analyzer -->
  <g class="card-hover-area" transform="translate(120, 85)">
    <rect x="0" y="0" width="370" height="220" class="card-bg" />
    
    <!-- Project number -->
    <text x="24" y="35" class="project-number">01</text>
    
    <!-- Title -->
    <text x="24" y="65" class="project-title">Windows Event</text>
    <text x="24" y="88" class="project-title">Analyzer</text>
    
    <!-- Description -->
    <text x="24" y="120" class="project-desc">
      <tspan x="24" dy="0">High-fidelity platform for advanced</tspan>
      <tspan x="24" dy="20">endpoint telemetry analysis and</tspan>
      <tspan x="24" dy="20">threat simulation.</tspan>
    </text>
    
    <!-- Tech stack -->
    <text x="24" y="185" class="project-label">TECHNOLOGIES</text>
    <text x="24" y="202" class="tech-tag">Python <tspan class="tech-tag-sep">·</tspan> Sysmon <tspan class="tech-tag-sep">·</tspan> KQL</text>
  </g>

  <!-- Project 2: Linux Auth Analyzer -->
  <g class="card-hover-area" transform="translate(510, 85)">
    <rect x="0" y="0" width="370" height="220" class="card-bg" />
    
    <text x="24" y="35" class="project-number">02</text>
    
    <text x="24" y="65" class="project-title">Linux Auth</text>
    <text x="24" y="88" class="project-title">Analyzer</text>
    
    <text x="24" y="120" class="project-desc">
      <tspan x="24" dy="0">Automated forensic analysis of SSH</tspan>
      <tspan x="24" dy="20">logs, auditd trails, and anomalous</tspan>
      <tspan x="24" dy="20">activity detection.</tspan>
    </text>
    
    <text x="24" y="185" class="project-label">TECHNOLOGIES</text>
    <text x="24" y="202" class="tech-tag">Python <tspan class="tech-tag-sep">·</tspan> Linux <tspan class="tech-tag-sep">·</tspan> Auditd</text>
  </g>

  <!-- Project 3: IOC Detection Engine -->
  <g class="card-hover-area" transform="translate(120, 325)">
    <rect x="0" y="0" width="370" height="220" class="card-bg" />
    
    <text x="24" y="35" class="project-number">03</text>
    
    <text x="24" y="65" class="project-title">IOC Detection</text>
    <text x="24" y="88" class="project-title">Engine</text>
    
    <text x="24" y="120" class="project-desc">
      <tspan x="24" dy="0">Enterprise-grade platform for fast</tspan>
      <tspan x="24" dy="20">behavioral analysis and IOC</tspan>
      <tspan x="24" dy="20">correlation at scale.</tspan>
    </text>
    
    <text x="24" y="185" class="project-label">TECHNOLOGIES</text>
    <text x="24" y="202" class="tech-tag">Go <tspan class="tech-tag-sep">·</tspan> Elastic <tspan class="tech-tag-sep">·</tspan> Docker</text>
  </g>

  <!-- Project 4: Sigma Rule Pack -->
  <g class="card-hover-area" transform="translate(510, 325)">
    <rect x="0" y="0" width="370" height="220" class="card-bg" />
    
    <text x="24" y="35" class="project-number">04</text>
    
    <text x="24" y="65" class="project-title">Sigma Rule</text>
    <text x="24" y="88" class="project-title">Collection</text>
    
    <text x="24" y="120" class="project-desc">
      <tspan x="24" dy="0">Production-ready detection rules</tspan>
      <tspan x="24" dy="20">for Windows, Linux, and cloud</tspan>
      <tspan x="24" dy="20">environments.</tspan>
    </text>
    
    <text x="24" y="185" class="project-label">TECHNOLOGIES</text>
    <text x="24" y="202" class="tech-tag">Sigma <tspan class="tech-tag-sep">·</tspan> YARA <tspan class="tech-tag-sep">·</tspan> Splunk</text>
  </g>

  <!-- View all link -->
  <g transform="translate(120, 575)">
    <text x="0" y="0" class="link-text link-text-primary">VIEW ALL PROJECTS</text>
    <text x="155" y="0" class="link-arrow">→</text>
  </g>

  <!-- Bottom divider -->
  <line x1="120" y1="606" x2="880" y2="606" class="divider-line" />
</svg>
