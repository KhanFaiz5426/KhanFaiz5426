<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap');
      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .label { font-weight: 500; font-size: 10px; fill: #10B981; letter-spacing: 0.3em; text-transform: uppercase; }
      .num { font-weight: 600; font-size: 10px; fill: #3F3F46; letter-spacing: 0.1em; }
      .title { font-weight: 600; font-size: 18px; fill: #FAFAFA; letter-spacing: -0.02em; }
      .desc { font-weight: 400; font-size: 12px; fill: #52525B; line-height: 1.6; }
      .meta { font-weight: 500; font-size: 9px; fill: #52525B; letter-spacing: 0.2em; text-transform: uppercase; }
      .tag { font-weight: 400; font-size: 11px; fill: #A1A1AA; }
      .link { font-weight: 500; font-size: 11px; fill: #52525B; letter-spacing: 0.05em; }
      .link-accent { fill: #10B981; }
      .line { stroke: #FFFFFF; stroke-opacity: 0.05; stroke-width: 1; }
      .card { fill: #0D0D0F; stroke: #1A1A1E; stroke-width: 1; rx: 8; }
      .card-top { fill: #10B981; opacity: 0.08; }
      a { cursor: pointer; }
    </style>
  </defs>

  <rect width="1000" height="600" fill="#09090B"/>

  <!-- Divider -->
  <line x1="120" y1="15" x2="880" y2="15" class="line"/>

  <!-- Label -->
  <text x="120" y="55" class="label">PROJECTS</text>

  <!-- Project 1 -->
  <g transform="translate(120, 80)">
    <rect width="370" height="210" class="card"/>
    <rect width="370" height="2" class="card-top" rx="1"/>
    <g transform="translate(24, 28)">
      <text class="num">01</text>
      <text y="28" class="title">Windows Event</text>
      <text y="48" class="title">Analyzer</text>
      <text y="74" class="desc">
        <tspan x="0" dy="0">High-fidelity platform for advanced</tspan>
        <tspan x="0" dy="18">endpoint telemetry and threat</tspan>
        <tspan x="0" dy="18">simulation on Windows.</tspan>
      </text>
      <text y="132" class="meta">STACK</text>
      <text y="148" class="tag">Python · Sysmon · KQL</text>
    </g>
    <g transform="translate(24, 180)">
      <a href="https://github.com/KhanFaiz5426" target="_blank">
        <text class="link link-accent">Source →</text>
      </a>
    </g>
  </g>

  <!-- Project 2 -->
  <g transform="translate(510, 80)">
    <rect width="370" height="210" class="card"/>
    <rect width="370" height="2" class="card-top" rx="1"/>
    <g transform="translate(24, 28)">
      <text class="num">02</text>
      <text y="28" class="title">Linux Auth</text>
      <text y="48" class="title">Analyzer</text>
      <text y="74" class="desc">
        <tspan x="0" dy="0">Automated forensic analysis of</tspan>
        <tspan x="0" dy="18">SSH logs, auditd trails, and</tspan>
        <tspan x="0" dy="18">anomalous activity detection.</tspan>
      </text>
      <text y="132" class="meta">STACK</text>
      <text y="148" class="tag">Python · Linux · Auditd</text>
    </g>
    <g transform="translate(24, 180)">
      <a href="https://github.com/KhanFaiz5426" target="_blank">
        <text class="link link-accent">Source →</text>
      </a>
    </g>
  </g>

  <!-- Project 3 -->
  <g transform="translate(120, 310)">
    <rect width="370" height="210" class="card"/>
    <rect width="370" height="2" class="card-top" rx="1"/>
    <g transform="translate(24, 28)">
      <text class="num">03</text>
      <text y="28" class="title">IOC Detection</text>
      <text y="48" class="title">Engine</text>
      <text y="74" class="desc">
        <tspan x="0" dy="0">Enterprise-grade platform for fast</tspan>
        <tspan x="0" dy="18">behavioral analysis and IOC</tspan>
        <tspan x="0" dy="18">correlation at scale.</tspan>
      </text>
      <text y="132" class="meta">STACK</text>
      <text y="148" class="tag">Go · Elastic · Docker</text>
    </g>
    <g transform="translate(24, 180)">
      <a href="https://github.com/KhanFaiz5426" target="_blank">
        <text class="link link-accent">Source →</text>
      </a>
    </g>
  </g>

  <!-- Project 4 -->
  <g transform="translate(510, 310)">
    <rect width="370" height="210" class="card"/>
    <rect width="370" height="2" class="card-top" rx="1"/>
    <g transform="translate(24, 28)">
      <text class="num">04</text>
      <text y="28" class="title">Sigma Rule</text>
      <text y="48" class="title">Collection</text>
      <text y="74" class="desc">
        <tspan x="0" dy="0">Production-ready detection rules</tspan>
        <tspan x="0" dy="18">for Windows, Linux, and cloud</tspan>
        <tspan x="0" dy="18">environments. High fidelity.</tspan>
      </text>
      <text y="132" class="meta">STACK</text>
      <text y="148" class="tag">Sigma · YARA · Splunk</text>
    </g>
    <g transform="translate(24, 180)">
      <a href="https://github.com/KhanFaiz5426" target="_blank">
        <text class="link link-accent">Source →</text>
      </a>
    </g>
  </g>

  <!-- Bottom divider -->
  <line x1="120" y1="585" x2="880" y2="585" class="line"/>
</svg>
