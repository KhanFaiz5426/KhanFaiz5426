<svg width="880" height="1060" viewBox="0 0 880 1060" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap');

      * { font-family: 'Inter', -apple-system, sans-serif; }
      .serif { font-family: 'Instrument Serif', Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }

      @keyframes slow-pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      .indicator-pulse { animation: slow-pulse 6s ease-in-out infinite; transform-origin: center; }

      @keyframes flow-up {
        0% { transform: translateY(40px); opacity: 0; }
        20% { opacity: 0.5; }
        80% { opacity: 0.5; }
        100% { transform: translateY(-40px); opacity: 0; }
      }
      .data-flow { animation: flow-up 8s ease-in-out infinite; }

      @keyframes scan-line {
        0% { transform: translateX(-40px); opacity: 0; }
        10% { opacity: 0.6; }
        90% { opacity: 0.6; }
        100% { transform: translateX(120px); opacity: 0; }
      }
      .scanner { animation: scan-line 10s ease-in-out infinite; }
    </style>

    <!-- Card Backgrounds -->
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141419" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0A0A0D" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12141A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0A0A0C" stop-opacity="1"/>
    </linearGradient>

    <!-- Card Borders (Glass effect) -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Project 1 Accent Glow (Pale Gold) -->
    <radialGradient id="glow-1" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#E8A84C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E8A84C" stop-opacity="0"/>
    </radialGradient>

    <!-- Project 2 Accent Glow (Pale Silver) -->
    <radialGradient id="glow-2" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#E4E4E7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#E4E4E7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="880" height="1060" fill="#0A0A0C"/>

  <!-- Section Title -->
  <text x="440" y="80" text-anchor="middle" font-size="12" font-weight="500" fill="#71717A" letter-spacing="0.2em">SELECTED WORK</text>

  <!-- ═══════════════════════════════════════════════════════════
       CARD 1: Windows Event Analyzer
       ═══════════════════════════════════════════════════════════ -->
  <g transform="translate(40, 140)">
    <!-- Base Card -->
    <rect width="800" height="400" rx="24" fill="url(#card-grad-1)" stroke="url(#border-grad)" stroke-width="1"/>
    <!-- Ambient Glow -->
    <rect width="800" height="400" rx="24" fill="url(#glow-1)"/>

    <!-- Content Layout (Left side text, Right side abstract visual) -->
    
    <!-- Status -->
    <g transform="translate(60, 60)">
      <circle cx="4" cy="-4" r="4" fill="#E8A84C" class="indicator-pulse"/>
      <text x="18" y="0" font-size="11" font-weight="500" fill="#E8A84C" letter-spacing="0.1em">IN DEVELOPMENT</text>
    </g>

    <!-- Typography -->
    <text x="60" y="140" class="serif" font-size="48" fill="#F4F4F5">Windows Event Analyzer</text>
    <text x="60" y="180" font-size="16" font-weight="300" fill="#A1A1AA" line-height="1.6">
      <tspan x="60" dy="0">Real-time EVTX parsing and threat detection.</tspan>
      <tspan x="60" dy="28">Ingests binary XML streams to correlate security</tspan>
      <tspan x="60" dy="28">events and flag suspicious logon patterns.</tspan>
    </text>

    <!-- Tech Stack / Badges -->
    <g transform="translate(60, 310)" class="mono" font-size="11" fill="#71717A">
      <rect x="0" y="-16" width="64" height="26" rx="13" fill="#FFFFFF" opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="32" y="1" text-anchor="middle">Python</text>
      
      <rect x="76" y="-16" width="56" height="26" rx="13" fill="#FFFFFF" opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="104" y="1" text-anchor="middle">EVTX</text>
      
      <rect x="144" y="-16" width="60" height="26" rx="13" fill="#FFFFFF" opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="174" y="1" text-anchor="middle">Sigma</text>
    </g>

    <!-- Abstract Visual: Event scanning (Right side) -->
    <g transform="translate(560, 100)">
      <!-- Minimalist code/log lines -->
      <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-linecap="round" stroke-width="4">
        <line x1="0" y1="40" x2="80" y2="40"/>
        <line x1="0" y1="60" x2="140" y2="60"/>
        <line x1="0" y1="80" x2="100" y2="80"/>
        
        <line x1="0" y1="120" x2="160" y2="120"/>
        <line x1="0" y1="140" x2="90" y2="140"/>
        
        <line x1="0" y1="180" x2="130" y2="180"/>
        <line x1="0" y1="200" x2="110" y2="200"/>
      </g>
      
      <!-- Highlighted event (Sigma match representation) -->
      <line x1="0" y1="120" x2="160" y2="120" stroke="#E8A84C" stroke-width="4" stroke-opacity="0.2" stroke-linecap="round"/>
      
      <!-- Scanning element overlay -->
      <rect x="0" y="30" width="4" height="190" fill="#E8A84C" rx="2" class="scanner"/>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       CARD 2: Linux Auth Analyzer
       ═══════════════════════════════════════════════════════════ -->
  <a href="https://github.com/KhanFaiz5426/Linux-auth-analyzer">
    <g transform="translate(40, 580)">
      <!-- Base Card -->
      <rect width="800" height="400" rx="24" fill="url(#card-grad-2)" stroke="url(#border-grad)" stroke-width="1"/>
      <rect width="800" height="400" rx="24" fill="url(#glow-2)"/>

      <!-- Content Layout (Left side text, Right side abstract visual) -->
      
      <!-- Status -->
      <g transform="translate(60, 60)">
        <circle cx="4" cy="-4" r="4" fill="#FFFFFF" class="indicator-pulse" opacity="0.6"/>
        <text x="18" y="0" font-size="11" font-weight="500" fill="#E4E4E7" letter-spacing="0.1em">SHIPPED</text>
      </g>

      <!-- Typography -->
      <text x="60" y="140" class="serif" font-size="48" fill="#F4F4F5">Linux Auth Analyzer</text>
      <text x="60" y="180" font-size="16" font-weight="300" fill="#A1A1AA" line-height="1.6">
        <tspan x="60" dy="0">Automated auth.log analysis via regex parsing.</tspan>
        <tspan x="60" dy="28">Tracks stateful evidence chains over time to detect</tspan>
        <tspan x="60" dy="28">anomalies, brute-forcing, and persistence.</tspan>
      </text>

      <!-- Tech Stack / Badges -->
      <g transform="translate(60, 310)" class="mono" font-size="11" fill="#71717A">
        <rect x="0" y="-16" width="64" height="26" rx="13" fill="#FFFFFF" opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <text x="32" y="1" text-anchor="middle">Python</text>
        
        <rect x="76" y="-16" width="60" height="26" rx="13" fill="#FFFFFF" opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <text x="106" y="1" text-anchor="middle">Regex</text>
        
        <rect x="148" y="-16" width="64" height="26" rx="13" fill="#FFFFFF" opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <text x="180" y="1" text-anchor="middle">Syslog</text>
      </g>

      <!-- Repository Link Arrow -->
      <g transform="translate(60, 350)">
        <text x="0" y="0" class="mono" font-size="12" fill="#E4E4E7" font-weight="500">View Repository →</text>
      </g>

      <!-- Abstract Visual: Data flow / correlation (Right side) -->
      <g transform="translate(560, 80)">
        <!-- Vertical structural lines -->
        <line x1="40" y1="0" x2="40" y2="240" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
        <line x1="80" y1="0" x2="80" y2="240" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
        <line x1="120" y1="0" x2="120" y2="240" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
        
        <!-- Animated data flowing upwards -->
        <circle cx="40" cy="120" r="3" fill="#E4E4E7" class="data-flow"/>
        <circle cx="80" cy="180" r="3" fill="#E4E4E7" class="data-flow" style="animation-delay: -3s"/>
        <circle cx="120" cy="80" r="3" fill="#E4E4E7" class="data-flow" style="animation-delay: -6s"/>
        
        <!-- Central node -->
        <circle cx="80" cy="120" r="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
        <circle cx="80" cy="120" r="2" fill="#FFFFFF" opacity="0.4"/>
      </g>
    </g>
  </a>

</svg>
