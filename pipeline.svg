<svg width="880" height="420" viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Inter:wght@200;300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');

      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .serif { font-family: 'Instrument Serif', Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace; }

      @keyframes center-breathe {
        0%, 100% { opacity: 0.06; }
        50% { opacity: 0.15; }
      }
      .breathe { animation: center-breathe 6s ease-in-out infinite; }
    </style>

    <linearGradient id="p-top-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8A84C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E8A84C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E8A84C" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="p-connector-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8A84C" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E8A84C" stop-opacity="0.08"/>
    </linearGradient>

    <radialGradient id="p-pulse-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8A84C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="880" height="420" fill="#08080A"/>

  <!-- Top edge accent -->
  <rect width="880" height="1" fill="url(#p-top-edge)"/>

  <!-- Subtle background glow -->
  <ellipse cx="440" cy="320" rx="400" ry="120" fill="#E8A84C" opacity="0.012" class="breathe"/>

  <!-- Corner registration marks -->
  <g stroke="#1C1C22" stroke-width="1" opacity="0.6">
    <line x1="56" y1="24" x2="64" y2="24"/><line x1="60" y1="20" x2="60" y2="28"/>
    <line x1="816" y1="24" x2="824" y2="24"/><line x1="820" y1="20" x2="820" y2="28"/>
    <line x1="56" y1="400" x2="64" y2="400"/><line x1="60" y1="396" x2="60" y2="404"/>
    <line x1="816" y1="400" x2="824" y2="400"/><line x1="820" y1="396" x2="820" y2="404"/>
  </g>

  <!-- Monogram -->
  <text x="60" y="54" class="mono" font-size="10" font-weight="500" fill="#1C1C22" letter-spacing="0.2em">FK</text>

  <!-- Module ID -->
  <text x="820" y="54" text-anchor="end" class="mono" font-size="9" fill="#2A2A32" letter-spacing="0.12em">SYS—01</text>

  <!-- Name -->
  <text x="60" y="150" class="serif" font-size="68" font-weight="400" fill="#E4E4E7" letter-spacing="-0.03em">Faiz Khan.</text>

  <!-- Role line -->
  <text x="62" y="184" font-size="11" font-weight="400" fill="#8B8B96" letter-spacing="0.18em">DETECTION ENGINEERING   ·   BLUE TEAM   ·   THREAT HUNTING</text>

  <!-- Description -->
  <text x="62" y="218" font-size="14" font-weight="300" fill="#555560" letter-spacing="0.01em">Building the systems that turn raw endpoint telemetry into detections.</text>

  <!-- ─── Pipeline Section ─── -->

  <!-- Divider -->
  <line x1="60" y1="254" x2="820" y2="254" stroke="#FFFFFF" stroke-opacity="0.04"/>

  <!-- Section label -->
  <text x="60" y="284" class="mono" font-size="9" font-weight="500" fill="#3A3A44" letter-spacing="0.25em">DETECTION LIFECYCLE</text>

  <!-- Revision annotation -->
  <text x="820" y="284" text-anchor="end" class="mono" font-size="8" fill="#22222A" letter-spacing="0.1em">rev 3.1</text>

  <!-- Stage Boxes (5 stages, 112×52, gap 50) -->

  <!-- Stage 1: INGEST -->
  <rect x="60" y="304" width="112" height="52" rx="4" fill="#0C0C0F" stroke="#1C1C22"/>
  <text x="116" y="335" text-anchor="middle" font-size="10" font-weight="500" fill="#E4E4E7" letter-spacing="0.1em">INGEST</text>
  <text x="116" y="376" text-anchor="middle" class="mono" font-size="8" fill="#3A3A44">auth.log · evtx · pcap</text>

  <!-- Connector 1→2 -->
  <line x1="172" y1="330" x2="222" y2="330" stroke="#1C1C22" stroke-dasharray="4 4"/>
  <polygon points="218,326 226,330 218,334" fill="#2A2A32"/>

  <!-- Stage 2: PARSE -->
  <rect x="222" y="304" width="112" height="52" rx="4" fill="#0C0C0F" stroke="#1C1C22"/>
  <text x="278" y="335" text-anchor="middle" font-size="10" font-weight="500" fill="#E4E4E7" letter-spacing="0.1em">PARSE</text>
  <text x="278" y="376" text-anchor="middle" class="mono" font-size="8" fill="#3A3A44">regex · BinXML · decode</text>

  <!-- Connector 2→3 -->
  <line x1="334" y1="330" x2="384" y2="330" stroke="#1C1C22" stroke-dasharray="4 4"/>
  <polygon points="380,326 388,330 380,334" fill="#2A2A32"/>

  <!-- Stage 3: DETECT -->
  <rect x="384" y="304" width="112" height="52" rx="4" fill="#0C0C0F" stroke="#1C1C22"/>
  <rect x="384" y="304" width="112" height="52" rx="4" fill="#E8A84C" opacity="0.03"/>
  <text x="440" y="335" text-anchor="middle" font-size="10" font-weight="500" fill="#E4E4E7" letter-spacing="0.1em">DETECT</text>
  <text x="440" y="376" text-anchor="middle" class="mono" font-size="8" fill="#3A3A44">sigma · correlation</text>

  <!-- Connector 3→4 -->
  <line x1="496" y1="330" x2="546" y2="330" stroke="#1C1C22" stroke-dasharray="4 4"/>
  <polygon points="542,326 550,330 542,334" fill="#2A2A32"/>

  <!-- Stage 4: ALERT -->
  <rect x="546" y="304" width="112" height="52" rx="4" fill="#0C0C0F" stroke="#1C1C22"/>
  <text x="602" y="335" text-anchor="middle" font-size="10" font-weight="500" fill="#E4E4E7" letter-spacing="0.1em">ALERT</text>
  <text x="602" y="376" text-anchor="middle" class="mono" font-size="8" fill="#3A3A44">evidence · MITRE</text>

  <!-- Connector 4→5 -->
  <line x1="658" y1="330" x2="708" y2="330" stroke="#1C1C22" stroke-dasharray="4 4"/>
  <polygon points="704,326 712,330 704,334" fill="#2A2A32"/>

  <!-- Stage 5: RESPOND -->
  <rect x="708" y="304" width="112" height="52" rx="4" fill="#0C0C0F" stroke="#1C1C22"/>
  <text x="764" y="335" text-anchor="middle" font-size="10" font-weight="500" fill="#E4E4E7" letter-spacing="0.1em">RESPOND</text>
  <text x="764" y="376" text-anchor="middle" class="mono" font-size="8" fill="#3A3A44">nftables · block · kill</text>

  <!-- ─── Animated Data Pulse ─── -->
  <!-- Glow trail (larger, dimmer) -->
  <circle r="8" fill="#E8A84C" opacity="0">
    <animate attributeName="cx" values="116;278;440;602;764" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="cy" values="330;330;330;330;330" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.08;0.12;0.12;0.08;0.08;0" keyTimes="0;0.05;0.2;0.5;0.8;0.95;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Core pulse (small, bright) -->
  <circle r="3" fill="#E8A84C" opacity="0">
    <animate attributeName="cx" values="116;278;440;602;764" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="cy" values="330;330;330;330;330" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0.9;0.9;0.9;0" keyTimes="0;0.04;0.15;0.5;0.85;0.96;1" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
